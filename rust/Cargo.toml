[workspace]
members = ["crates/kcl-render", "crates/kclx"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/yurikrupnik/kcl-packages"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
# Pulled in directly only to pick a crypto provider: aws-lc-rs (tonic TLS) and
# ring (the OCI client) are both linked in, and rustls will not choose.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# The KCL Rust SDK is git-only: the `kcl-*` names on crates.io belong to
# KittyCAD's unrelated language. Pinned by rev because kcl-lang/lib itself
# depends on kcl-lang/kcl by branch, so a tag alone still floats.
kcl-lang = { git = "https://github.com/kcl-lang/lib", tag = "v0.12.4" }

# Runtime KCL package resolution (crate `kcl-render`, module `deps`). Every
# one of these is already in the tree via the KCL SDK's own driver, so the
# versions match what it pulls and nothing new is compiled: `toml` is
# deliberately 0.5, the version the SDK's config crate uses.
flate2 = "1"
oci-client = { version = "0.11", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
