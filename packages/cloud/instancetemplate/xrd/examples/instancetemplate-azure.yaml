apiVersion: cloud.example.org/v1alpha1
kind: InstanceTemplate
metadata:
  namespace: default
  name: build-agents
spec:
  # Azure has no launch-template object for standalone VMs: the template is
  # logical, and each instance below is rendered from these fields.
  region: westeurope
  resourceGroup: platform-rg         # Resource Group for the VMs, NICs and public IPs
  size: medium                       # -> Standard_D2s_v5
  image: ubuntu-24-04                # -> Canonical ubuntu-24_04-lts server
  diskGb: 50
  network:
    subnetId: /subscriptions/0b1f6471-1bf0-4dda-aec3-111122223333/resourceGroups/platform-rg/providers/Microsoft.Network/virtualNetworks/platform-vnet/subnets/vms
    publicIp: true                   # one PublicIP per instance
  sshKey:                            # REQUIRED on Azure (Linux VMs disable passwords)
    user: dev
    publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample build-agents
  userData: |
    #!/bin/sh
    echo hello > /etc/motd
  deletionPolicy: Delete
  tags:
    team: platform
  instances:                         # each -> LinuxVirtualMachine + NetworkInterface (+ PublicIP)
    - name: a
    - name: b
  crossplane:
    compositionSelector:
      matchLabels:
        provider: azure              # the flag: picks the backend (aws | gcp | azure | kubevirt)
