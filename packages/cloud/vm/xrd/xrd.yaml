apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: virtualmachines.cloud.example.org
spec:
  scope: Namespaced
  group: cloud.example.org
  names:
    kind: VirtualMachine
    plural: virtualmachines
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: |
                Portable virtual machine. Every field below is a COMMON
                parameter mapped to each backend's native resources (AWS EC2
                Instance + KeyPair, GCP Compute Instance, Azure
                LinuxVirtualMachine + NetworkInterface + optional PublicIP,
                self-hosted KubeVirt VirtualMachine + CDI DataVolume).
                A field a CLOUD backend cannot express makes the render FAIL
                with a clear message rather than silently changing the
                machine. The in-cluster backend has no cloud fabric at all,
                so the fields that describe one are documented as ignored
                there rather than silently dropped.
              properties:
                region:
                  type: string
                  description: Cloud region for the machine. GCP places it in a zone within the region (see zone). Ignored in-cluster, where it survives as a free-form site label — the machine runs wherever the cluster schedules it.
                zone:
                  type: string
                  description: GCP-only — the zone within region (e.g. us-central1-a). Defaults to "<region>-a". AWS/Azure pick availability themselves. Ignored in-cluster, where placement is the scheduler's business.
                size:
                  type: string
                  enum: [small, medium, large, xlarge]
                  default: small
                  description: 'Abstract machine shape, mapped per backend: small 2vCPU/4-8GB (t3.medium / e2-medium / Standard_B2s / 2 vCPU + 4Gi guest), medium 2/8 (m5.large / e2-standard-2 / Standard_D2s_v5 / 2 vCPU + 8Gi), large 4/16 (m5.xlarge / e2-standard-4 / Standard_D4s_v5 / 4 vCPU + 16Gi), xlarge 8/32 (m5.2xlarge / e2-standard-8 / Standard_D8s_v5 / 8 vCPU + 32Gi).'
                machineType:
                  type: string
                  description: Native instance/machine/VM type that overrides the size mapping. In-cluster it is a VirtualMachineClusterInstancetype name, which owns the guest's CPU and memory outright — KubeVirt rejects a machine that sets both.
                image:
                  type: string
                  enum: [ubuntu-24-04, ubuntu-22-04, debian-12]
                  default: ubuntu-24-04
                  description: Abstract OS image, mapped to each backend's image family — in-cluster, a quay.io/containerdisks image imported into the root disk. AWS has no account-independent image families, so the aws backend requires imageId instead and fails the render without it.
                imageId:
                  type: string
                  description: 'Native image override. AWS: AMI ID (REQUIRED there). GCP: full image/family self-link. Azure: source image resource ID. KubeVirt: any container image reference holding a disk image, used verbatim.'
                diskGb:
                  type: integer
                  default: 30
                  minimum: 10
                  description: Root/OS disk size in GiB. In-cluster it sizes the PVC that CDI imports the image into, which is what makes the root disk survive a restart.
                storageClass:
                  type: string
                  description: In-cluster only — StorageClass for the root disk PVC; unset uses the cluster default. Ignored by the managed backends, which have no StorageClasses.
                spot:
                  type: boolean
                  default: false
                  description: Run on spot/preemptible capacity. AWS instanceMarketOptions=spot / GCP provisioningModel=SPOT / Azure priority=Spot with Deallocate eviction. Ignored in-cluster — there is no reclaimable capacity market to opt into.
                network:
                  type: object
                  description: Existing network to attach to. Each field targets one cloud; the in-cluster backend needs none of them and ignores the whole block — the machine gets masqueraded pod networking, so it is reachable exactly like a Pod.
                  properties:
                    subnetId:
                      type: string
                      description: 'Subnet for the primary interface. AWS: subnet ID (default VPC when omitted). GCP: subnetwork self-link or name (default network when omitted). Azure: full subnet resource ID, REQUIRED (the composed NIC cannot exist without it). Ignored in-cluster.'
                    securityGroupIds:
                      type: array
                      items: {type: string}
                      description: AWS-only — VPC security group IDs for the instance. Ignored in-cluster, where NetworkPolicy governs reachability.
                    publicIp:
                      type: boolean
                      default: false
                      description: Give the machine a public address. AWS associatePublicIpAddress / GCP accessConfig / Azure a composed PublicIP. Ignored in-cluster; expose the machine with a Service instead.
                sshKey:
                  type: object
                  description: SSH access. AWS composes a KeyPair; GCP writes metadata ssh-keys; Azure sets the admin user's key (REQUIRED there — Azure Linux VMs disable passwords); in-cluster the key is composed into a Secret and injected through KubeVirt accessCredentials with noCloud propagation.
                  properties:
                    user:
                      type: string
                      description: Login user the key is authorized for (Azure adminUsername / GCP metadata user; AWS key pairs are user-agnostic — the AMI picks the login user). Ignored in-cluster, where noCloud propagation authorizes the containerdisk's own default user.
                    publicKey:
                      type: string
                      description: OpenSSH public key material.
                  required: [user, publicKey]
                userData:
                  type: string
                  description: Boot script/cloud-init. AWS userData / GCP metadata startup-script / Azure customData (base64-encoded by the composition) / KubeVirt cloudInitNoCloud userData, verbatim. In-cluster a minimal '#cloud-config' is emitted when this is unset, because ssh key propagation needs that NoCloud disk to exist.
                resourceGroup:
                  type: string
                  description: Azure-only — the Resource Group the machine (and its NIC/PublicIP) lives in. Required by the azure backend. Ignored in-cluster.
                deletionPolicy:
                  type: string
                  enum: [Delete, Orphan]
                  default: Delete
                  description: What happens to the cloud machine when this resource is deleted; maps to Crossplane managementPolicies (Orphan keeps the external machine). Ignored in-cluster, where the VirtualMachine's lifetime follows the XR.
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key/value metadata. AWS/Azure tags, GCP labels, in-cluster labels on the VirtualMachine.
              required:
                - region
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: True once the machine is provisioned.
                provider:
                  type: string
                  description: Backend that fulfilled the claim (aws | gcp | azure | kubevirt).
                privateIp:
                  type: string
                  description: Primary private IP address. Absent in-cluster — the guest's address is reported on the VirtualMachineInstance, which the kubevirt backend does not compose.
                publicIp:
                  type: string
                  description: Public IP address, when requested. Absent in-cluster, for the same reason as privateIp.
                name:
                  type: string
                  description: Provider-side machine name.
                id:
                  type: string
                  description: Provider-assigned resource id.
                cloud-url:
                  type: string
                  description: Cloud-console URL for the machine.
      additionalPrinterColumns:
        - name: READY
          type: boolean
          jsonPath: .status.ready
        - name: PROVIDER
          type: string
          jsonPath: .status.provider
        - name: PRIVATE-IP
          type: string
          jsonPath: .status.privateIp
        - name: PUBLIC-IP
          type: string
          jsonPath: .status.publicIp
