apiVersion: cloud.example.org/v1alpha1
kind: BackupPlan
metadata:
  # The azure backend composes namespaced Crossplane managed resources, so the
  # plan may live in any namespace. The name becomes the Backup vault, policy
  # and instance names: 3-50 letters, digits or hyphens.
  namespace: default
  name: nightly
spec:
  schedule: "0 2 * * *"           # -> R/2024-01-01T02:00:00+00:00/P1D; daily or every 4/6/8/12h only
  retentionDays: 30               # -> default retention rule P30D, operational store (max 360)
  includedNamespaces:             # -> backupDatasourceParameters.includedNamespaces; empty = all
    - zerg
    - dbs
  excludedResources:              # -> excludedResourceTypes
    - events
    - events.events.k8s.io
  labelSelector:                  # -> labelSelectors ["backup=nightly"]
    backup: nightly
  snapshotVolumes: true           # -> volumeSnapshotEnabled (CSI disk snapshots in the snapshot RG)
  cluster:
    # The AKS cluster's ARM id — a KubernetesCluster XR publishes it as
    # status.id. Its subscription must be the ProviderConfig's.
    id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/platform-rg/providers/Microsoft.ContainerService/managedClusters/platform
    region: westeurope            # required: vault, policy and instance location (an ARM id has none)
    snapshotResourceGroup: platform-snapshots  # must exist; defaults to the cluster's resource group
  destination:
    provider: azure               # required: the AKS backup extension writes only to Blob Storage
    bucket: aks-backups           # blob container; must already exist — compose a Bucket XR for that
    storageAccount: platformbackups  # the account holding the container
    resourceGroup: platform-rg    # the account's resource group; defaults to the cluster's
  paused: false                   # true fails the render: Azure cannot pause, only delete with data
  deletionPolicy: Orphan          # keep vault, policy and instance (and so the backups) if the XR goes
  tags:                           # tags on the Backup vault
    team: platform
  crossplane:
    compositionSelector:
      matchLabels:
        provider: azure           # the flag: picks the backend (azure)
