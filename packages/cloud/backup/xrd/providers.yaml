# Crossplane providers the BackupPlan Compositions render against. Install
# only the ones whose backends you intend to use.
#
# The velero backend composes velero.io/v1 objects DIRECTLY, so no Crossplane
# provider is involved in a velero backup. It needs the Velero operator instead,
# which providerconfigs.yaml installs through provider-helm. This is the same
# shape as the in-cluster (cnpg) PostgresInstance backend: the thing that talks
# to AWS/GCP/Azure is the operator's own object-store plugin, authenticated by
# the Secret in spec.destination.credentialsSecret, not a Crossplane
# ProviderConfig.
#
# The cloud backends are ordinary Crossplane managed resources:
#   aws    provider-aws-backup (Vault, Plan, Selection) + provider-aws-iam
#          (the AWS Backup service role)
#   gcp    provider-gcp-gke (BackupBackupPlan)
#   azure  provider-azure-dataprotection (vault, policy, instance) +
#          provider-azure-containerservice (the AKS backup extension, and a
#          read-only view of the cluster) + provider-azure-authorization (role
#          assignments, trusted access)
#
# The versions here are the ones the schema packages under packages/providers/
# were generated from (`just seed-backup-providers`) — keep them in step, or the
# rendered manifests can reference fields the installed provider does not have.
#
# The Helm chart install needs provider-helm v1.x — that is the first line that
# ships the namespaced `helm.m.crossplane.io` CRDs the Release below is typed
# against.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-backup
spec:
  package: ghcr.io/crossplane-contrib/provider-aws-backup:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-iam
spec:
  package: ghcr.io/crossplane-contrib/provider-aws-iam:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-gke
spec:
  package: ghcr.io/crossplane-contrib/provider-gcp-gke:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-dataprotection
spec:
  package: ghcr.io/crossplane-contrib/provider-azure-dataprotection:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-containerservice
spec:
  package: ghcr.io/crossplane-contrib/provider-azure-containerservice:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-authorization
spec:
  package: ghcr.io/crossplane-contrib/provider-azure-authorization:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
spec:
  package: ghcr.io/crossplane-contrib/provider-helm:v1.3.0
  runtimeConfigRef:
    name: provider-helm
---
# provider-helm needs in-cluster RBAC to install charts. This binds its
# ServiceAccount to cluster-admin, which is what the upstream quickstart does;
# scope it down before using this outside a sandbox.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-helm
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-helm-cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-helm
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-helm
