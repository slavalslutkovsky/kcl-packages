apiVersion: cloud.example.org/v1alpha1
kind: PackageRegistry
metadata:
  namespace: default
  name: my-packages
spec:
  region: us-east-1
  formats:                       # ECR for oci; ONE CodeArtifact domain + repository for npm and pypi
    - oci
    - npm
    - pypi
  immutableTags: true            # ECR imageTagMutability=IMMUTABLE — a tag can never be moved
  scanOnPush: true               # ECR basic scanning on every push (default true)
  publicAccess: false            # true adds a repository policy granting anonymous pull
  untaggedRetentionDays: 14      # lifecycle rule: expire untagged images after 14 days
  keepLastImages: 30             # lifecycle rule: keep only the 30 most recent images
  encryptionKeyId: arn:aws:kms:us-east-1:111122223333:key/abcd-ef  # SSE-KMS for ECR, encryptionKey for the CodeArtifact domain
  forceDestroy: false            # true deletes the repository even when it still holds images
  deletionPolicy: Delete         # Delete | Orphan — Orphan keeps the ECR/CodeArtifact resources
  tags:
    team: platform
    cost-center: "42"
  # Ignored by the CodeArtifact half: immutableTags, scanOnPush, publicAccess,
  # untaggedRetentionDays and keepLastImages are ECR-only. `go` is not
  # available on this backend at all — use gcp or forgejo for a Go proxy.
  crossplane:
    compositionSelector:
      matchLabels:
        provider: aws            # the flag: picks the backend (aws | gcp | azure | zot | forgejo)
