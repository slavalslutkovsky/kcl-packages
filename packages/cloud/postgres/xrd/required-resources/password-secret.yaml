# The Secret the vm backend READS. Not composed: the postgres-vm Composition
# asks Crossplane to fetch spec.passwordSecret (a meta.krm.kcl.dev
# RequiredResources item) and bakes only md5(password + username) into the
# machine's boot script. `crossplane render` serves it from here; on a cluster
# it is whatever Secret the XR names, in the XR's namespace. The other backends
# never request it.
apiVersion: v1
kind: Secret
metadata:
  name: my-pg-password
  namespace: default
type: Opaque
# `data`, not `stringData`: render hands the object over verbatim, and only
# the API server would turn stringData into data.
data:
  password: Y2hhbmdlLW1l          # "change-me"
