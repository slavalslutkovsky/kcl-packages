# ProviderConfigs and cluster prerequisites for the PostgresInstance backends.
#
# Kept out of providers.yaml on purpose: these are instances of CRDs that a
# Provider installs, so a single `kubectl apply` of both files fails with
# `no matches for kind "ClusterProviderConfig"`. Apply this only once the
# Providers report Healthy (`just e2e-providerconfigs` does that ordering).
#
# The AWS, GCP and Azure backends need real cloud credentials — add a
# ProviderConfig of your own with `credentials.source: Secret` (or IRSA /
# Workload Identity) before using them.
#
# The in-cluster (cnpg) backend needs the CloudNativePG operator, installed
# here as a pinned Helm Release through provider-helm. The operator is a
# cluster-wide singleton watching every namespace, so it lives with the
# platform prerequisites rather than inside a per-XR Composition.
apiVersion: helm.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: InjectedIdentity
---
# Chart 0.26.1 installs CloudNativePG 1.27.1 — the version the cnpg schema
# package (packages/providers/cnpg) was generated from. Keep them in step.
apiVersion: helm.m.crossplane.io/v1beta1
kind: Release
metadata:
  name: cloudnative-pg
  namespace: crossplane-system
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    namespace: cnpg-system
    chart:
      repository: https://cloudnative-pg.github.io/charts
      name: cloudnative-pg
      version: 0.26.1
    wait: true
    waitTimeout: 10m
