apiVersion: cloud.example.org/v1alpha1
kind: Queue
metadata:
  namespace: default
  name: orders
spec:
  # No cloud account involved: NACK reconciles a JetStream Stream + pull
  # Consumer against the shared NATS server installed by providerconfigs.yaml
  # (nats://nats.nats-system.svc.cluster.local:4222). `region` stays required
  # by the XRD, so give it something honest.
  region: in-cluster
  visibilityTimeoutSeconds: 60    # -> consumer ackWait
  retentionDays: 7                # -> stream maxAge
  deadLetter:
    enabled: true                 # -> consumer maxDeliver; JetStream has no separate
    maxReceives: 5                #    dead-letter store (see the XRD's deadLetter doc)
  persistence: true               # file storage (memory when false)
  persistenceSizeGb: 2            # -> stream maxBytes on the shared server
  replicas: 1                     # 3/5 need an equally sized NATS cluster
  deletionPolicy: Delete
  crossplane:
    compositionSelector:
      matchLabels:
        provider: nats            # the flag: picks the backend (aws | gcp | nats)
