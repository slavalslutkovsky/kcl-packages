# Crossplane Configuration package configuration-cluster: the cluster XRD and the
# Functions its Compositions run. Every backend is a package of its own
# (<backend>/crossplane.yaml) depending on this one, so installing a backend
# installs that backend's Providers and nothing else.
#
# Versioned here: `tools/configurations.sh bump cluster` after any change to
# xrd.yaml or this file (`check` fails on a stale digest). Functions are kept
# in step with functions.yaml by `tools/configurations.sh sync`.
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: cluster
  annotations:
    pkg.example.org/version: 0.1.0
    pkg.example.org/digest: 4ecf02cc5aa60b8e
spec:
  crossplane:
    version: ">=v2.2.0-0"
  dependsOn:
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: ghcr.io/crossplane-contrib/function-kcl
      version: v0.12.2
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      package: ghcr.io/crossplane-contrib/function-auto-ready
      version: v0.7.0
