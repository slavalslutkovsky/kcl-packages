# Crossplane providers the NetworkHub Compositions render against. Install
# only the ones whose backends you intend to use; each Composition references
# exactly one.
#
# The versions here are the ones the schema packages under packages/providers/
# were generated from (`just seed-hubspoke-providers`) — keep them in step, or
# the rendered manifests can reference fields the installed provider does not
# have.
#
# One family per cloud, because each cloud puts its hub in a different service:
# AWS keeps the Transit Gateway in ec2, Azure keeps Virtual WAN in network, and
# GCP has a service of its own (Network Connectivity Center).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-ec2
spec:
  package: ghcr.io/crossplane-contrib/provider-aws-ec2:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-networkconnectivity
spec:
  package: ghcr.io/crossplane-contrib/provider-gcp-networkconnectivity:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-azure-network
spec:
  package: ghcr.io/crossplane-contrib/provider-azure-network:v2.6.0
