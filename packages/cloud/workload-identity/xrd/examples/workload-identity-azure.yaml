# Azure Workload Identity: a User Assigned Identity plus a federated credential
# for this ServiceAccount; the composed ServiceAccount carries the client ID and
# the label the workload-identity webhook selects on.
apiVersion: cloud.example.org/v1alpha1
kind: WorkloadIdentity
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  displayName: External Secrets Operator
  serviceAccount:
    name: external-secrets
  identity:
    name: external-secrets
  region: westeurope
  resourceGroup: platform
  cluster:
    # az aks show -n <cluster> -g <rg> --query oidcIssuerProfile.issuerUrl -o tsv
    oidcIssuer: https://westeurope.oic.prod-aks.azure.com/00000000-0000-0000-0000-000000000000/11111111-1111-1111-1111-111111111111/
  accessPolicies:
    - role: Key Vault Secrets User
      scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/platform
  tags:
    team: platform
