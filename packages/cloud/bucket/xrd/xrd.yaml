apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: buckets.cloud.example.org
spec:
  scope: Namespaced
  group: cloud.example.org
  names:
    kind: Bucket
    plural: buckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: |
                Portable object-storage Bucket. Every field below is a COMMON
                parameter mapped to each cloud's native resources (GCP Cloud
                Storage Bucket, AWS S3 Bucket + companion configuration MRs).
              properties:
                region:
                  type: string
                  description: Cloud region/location for the Bucket (GCS location / S3 region).
                providerConfigName:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                  description: |
                    Cloud account the bucket is created in — and billed to. Names a
                    namespaced ProviderConfig in this XR's namespace; every composed
                    managed resource gets providerConfigRef {kind: ProviderConfig,
                    name: <this>}, so a tenant can only reach the accounts configured
                    in its own namespace (packages/platform/tenant-account renders
                    them for client-owned AWS accounts). Unset keeps the provider
                    default, the ClusterProviderConfig `default` — the platform's own
                    account. Rejected by the rustfs backend, which always uses its
                    in-cluster `rustfs` config.
                storageClass:
                  type: string
                  enum: [standard, nearline, cold, archive]
                  default: standard
                  description: Abstract storage tier; mapped to each cloud's native value (GCP native storage class; AWS lifecycle transition).
                versioning:
                  type: boolean
                  default: true
                  description: Keep noncurrent object versions. GCP Bucket.versioning / AWS BucketVersioning.
                forceDestroy:
                  type: boolean
                  default: false
                  description: Delete all contained objects when the bucket is destroyed. GCP/AWS forceDestroy.
                deletionPolicy:
                  type: string
                  enum: [Delete, Orphan]
                  default: Delete
                  description: What happens to the cloud bucket when this resource is deleted; maps to Crossplane managementPolicies (Orphan keeps the external bucket).
                blockPublicAccess:
                  type: boolean
                  default: true
                  description: Block all public access. GCP publicAccessPrevention=enforced / AWS BucketPublicAccessBlock (all four flags).
                uniformAccess:
                  type: boolean
                  default: true
                  description: Disable per-object ACLs, enforce bucket-level IAM. GCP uniformBucketLevelAccess / AWS BucketOwnershipControls=BucketOwnerEnforced.
                encryptionKmsKeyId:
                  type: string
                  description: CMEK/SSE-KMS key. When set, GCP encryption.defaultKmsKeyName / AWS SSE aws:kms with this key; otherwise provider-default encryption.
                requesterPays:
                  type: boolean
                  default: false
                  description: Charge requesters for access. GCP requesterPays / AWS BucketRequestPaymentConfiguration.
                retention:
                  type: object
                  description: Write-once-read-many object retention. GCP retentionPolicy / AWS Object Lock.
                  properties:
                    days:
                      type: integer
                      minimum: 1
                      description: Minimum retention in days.
                    mode:
                      type: string
                      enum: [governance, compliance]
                      default: governance
                      description: AWS Object Lock mode. compliance is irreversible and locks the GCP retention policy.
                  required: [days]
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key/value labels applied to the bucket. GCP labels / AWS tags.
                logging:
                  type: object
                  description: Server access logging to another bucket.
                  properties:
                    targetBucket:
                      type: string
                      description: Destination bucket name for access logs.
                    targetPrefix:
                      type: string
                      description: Object key prefix for log objects.
                  required: [targetBucket]
                website:
                  type: object
                  description: Static website hosting.
                  properties:
                    indexDocument:
                      type: string
                      default: index.html
                      description: Suffix served for directory requests (GCP mainPageSuffix / AWS index document).
                    errorDocument:
                      type: string
                      description: Object served for 404s (GCP notFoundPage / AWS error document).
                cors:
                  type: array
                  description: Cross-Origin Resource Sharing rules.
                  items:
                    type: object
                    properties:
                      origins:
                        type: array
                        items: {type: string}
                        description: Allowed origins ("*" for any).
                      methods:
                        type: array
                        items: {type: string}
                        description: Allowed HTTP methods.
                      headers:
                        type: array
                        items: {type: string}
                        description: Allowed request headers.
                      maxAgeSeconds:
                        type: integer
                        default: 3600
                        description: Preflight cache duration.
                    required: [origins, methods]
                lifecycleRules:
                  type: array
                  description: Object lifecycle management rules (in addition to the storageClass tier mapping).
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Rule identifier.
                      prefix:
                        type: string
                        default: ""
                        description: Object key prefix the rule matches.
                      expirationDays:
                        type: integer
                        description: Delete objects this many days after creation.
                      transitionDays:
                        type: integer
                        description: Transition objects after this many days.
                      transitionStorageClass:
                        type: string
                        enum: [standard, nearline, cold, archive]
                        description: Abstract tier to transition to; mapped per-provider.
                    required: [id]
                import:
                  type: object
                  description: |
                    Adopt a bucket that already exists — typically one Terraform or
                    Pulumi created — instead of creating a new one. existingName is
                    pinned as crossplane.io/external-name on every composed managed
                    resource, so the provider observes the real bucket rather than
                    creating a second one. Start in mode=observe (Crossplane only
                    reads; the old tool still owns writes), compare status against
                    the spec, then flip to mode=manage and drop the bucket from the
                    old tool's state (`terraform state rm` / `pulumi state delete`).
                    See docs/bucket-import.md.
                  properties:
                    existingName:
                      type: string
                      minLength: 1
                      description: Exact cloud name of the bucket to adopt (S3 bucket name, GCS bucket name, Azure storage account name). Terraform/Pulumi usually suffix these, so it rarely equals metadata.name.
                    mode:
                      type: string
                      enum: [observe, manage]
                      default: observe
                      description: observe sets managementPolicies=[Observe] — Crossplane never writes, so the old tool keeps ownership and nothing is changed by mistake. manage hands full control to Crossplane; deletionPolicy then applies as usual.
                    source:
                      type: string
                      enum: [terraform, pulumi, other]
                      description: Tool that created the bucket; recorded as an annotation on the composed resources for audit.
                    address:
                      type: string
                      description: Where the bucket lives in the old tool's state — a Terraform resource address (aws_s3_bucket.assets) or a Pulumi URN — so the state-removal step can be scripted from the XR alone.
                    resourceGroup:
                      type: string
                      description: Azure only — resource group of the storage account being adopted; the account cannot be observed without it. Ignored by the other backends.
                  required: [existingName]
                access:
                  type: array
                  description: |
                    Keyless access for CI pipelines (git clients) and the ticket
                    systems that start them, by OIDC federation — no keys.
                    Each entry is a federation binding (packages/cloud/federation)
                    plus a role:
                      GCP   a BucketIAMMember per member of the entry's workload
                            identity pool (the pool must exist in
                            federation.gcpProjectNumber, e.g. made by a GcpProject
                            from the same binding);
                      AWS   an IAM Role trusting the account's IAM OIDC provider
                            for the issuer (sub/aud) with an inline S3 policy;
                      Azure a User Assigned Identity, one federated credential per
                            subject, and a Storage Blob Data role on the account.
                    AWS and Azure see only the token's sub and aud: ticket,
                    workflows and condition need explicit subjects there, and
                    Azure always needs subjects (exact match). rustfs fails the
                    render: it has no per-bucket federation.
                  items:
                    type: object
                    x-kubernetes-validations:
                      - rule: "has(self.client) != has(self.customClient)"
                        message: exactly one of client or customClient must be set
                      - rule: "!(has(self.ticket) && has(self.customTicket))"
                        message: set ticket or customTicket, not both
                    properties:
                      role:
                        type: string
                        enum: [read, write, admin]
                        default: read
                        description: read = get/list objects; write = read + put/delete; admin = full object control (ACLs, retention, tags). Never bucket configuration or IAM.
                      client:
                        type: string
                        description: Built-in git client, a key of packages/cloud/federation/lib.k `clients` (github, github-enterprise, gitlab, bitbucket, azure-devops).
                      customClient:
                        type: object
                        description: Any other OIDC issuer; the fields of federation Client.
                        required: [id, label, issuer]
                        properties:
                          id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
                          label: {type: string}
                          issuer: {type: string, description: 'https:// issuer; "{host}" and "{owner}" are filled from the entry.'}
                          defaultHost: {type: string}
                          pool: {type: string}
                          provider: {type: string}
                          attributeMapping: {type: object, additionalProperties: {type: string}}
                          ownerKey: {type: string}
                          repositoryKey: {type: string}
                          triggerClaim: {type: string}
                          workflowKey: {type: string}
                          audiences: {type: array, items: {type: string}}
                          cloudAudiences: {type: object, additionalProperties: {type: array, items: {type: string}}}
                          requireAudiences: {type: boolean}
                          subjectByOwner: {type: string}
                          subjectByRepository: {type: string}
                          multiTenant: {type: boolean}
                      ticket:
                        type: string
                        description: Built-in ticket system, a key of federation `tickets` (jira, clickup, monday, asana, trello, linear, shortcut, youtrack, servicenow, zendesk, azure-boards, github-issues).
                      customTicket:
                        type: object
                        required: [id, label, triggers]
                        properties:
                          id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
                          label: {type: string}
                          triggers: {type: object, description: 'Trigger claim (event_name, pipeline_source) -> values.', additionalProperties: {type: array, items: {type: string}}}
                      pool: {type: string, pattern: '^[a-z0-9-]{4,32}$', description: GCP pool id; defaults to the client's (github-actions-pool) or <ticket>-<client>.}
                      provider: {type: string, pattern: '^[a-z0-9-]{4,32}$'}
                      host: {type: string, description: Self-managed instance (GitHub Enterprise Server, GitLab).}
                      issuerUri: {type: string, description: Replaces the client's issuer.}
                      owner: {type: string, description: Org / group / workspace / organization id.}
                      repositories: {type: array, items: {type: string}}
                      workflows: {type: array, items: {type: string, pattern: '^[^/@]+/[^/@]+/[^@]+(@.+)?$'}, description: '<owner>/<repo>/<path>[@<ref>] (GitHub workflow_ref); GCP only unless encoded in subjects.'}
                      subjects: {type: array, items: {type: string}, description: Exact token subjects. Required on Azure; on AWS they replace the owner/repository patterns.}
                      audiences: {type: array, items: {type: string}}
                      condition: {type: string, description: Extra CEL ANDed into the GCP provider condition; GCP only unless encoded in subjects.}
                federation:
                  type: object
                  description: Where `access` trusts tokens, per cloud. Each backend fails the render when its field is missing while `access` is set, and when another cloud's field is set.
                  properties:
                    gcpProjectNumber:
                      type: string
                      pattern: '^[0-9]+$'
                      description: GCP-only — number of the project holding the workload identity pools the access entries name.
                    awsAccountId:
                      type: string
                      pattern: '^[0-9]{12}$'
                      description: AWS-only — account whose IAM OIDC providers (one per issuer, created outside this XR) the roles trust.
                    awsPermissionsBoundary:
                      type: string
                      pattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+$'
                      description: AWS-only — managed policy ARN set as the permissionsBoundary of every access role. Required by an account whose provisioner role may only create boundary-capped roles (a client account from packages/platform/tenant-account with accessRoles); optional otherwise.
                    azureResourceGroup:
                      type: string
                      description: Azure-only — Resource Group for the access identities; defaults to import.resourceGroup.
              required:
                - region
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: True once the backing cloud bucket exists.
                provider:
                  type: string
                  description: Cloud backend that fulfilled the claim (gcp | aws).
                mode:
                  type: string
                  description: How Crossplane relates to the cloud bucket — created (Crossplane made it), observe (adopted, read-only) or managed (adopted, Crossplane owns writes).
                bucketName:
                  type: string
                  description: Name of the provisioned bucket.
                region:
                  type: string
                  description: Region/location the bucket resides in.
                storageClass:
                  type: string
                  description: Native storage class reported by the provider.
                url:
                  type: string
                  description: Native storage URI (gs://… or s3://…).
                cloud-url:
                  type: string
                  description: Cloud-console URL for the bucket.
                endpoint:
                  type: string
                  description: HTTP(S) host/domain for the bucket.
                arn:
                  type: string
                  description: AWS ARN (AWS only).
                selfLink:
                  type: string
                  description: GCP self link (GCP only).
                id:
                  type: string
                  description: Provider-assigned resource id.
                access:
                  type: array
                  description: What each access entry became — the principal a pipeline authenticates as.
                  items:
                    type: object
                    properties:
                      name: {type: string, description: Entry name (its pool id, plus provider id when set).}
                      role: {type: string}
                      members: {type: array, items: {type: string}, description: GCP IAM members granted.}
                      roleArn: {type: string, description: AWS role to assume (aws-actions/configure-aws-credentials role-to-assume).}
                      clientId: {type: string, description: Azure identity client id (azure/login client-id).}
                      tenantId: {type: string, description: Azure tenant id.}
      additionalPrinterColumns:
        - name: READY
          type: boolean
          jsonPath: .status.ready
        - name: PROVIDER
          type: string
          jsonPath: .status.provider
        - name: MODE
          type: string
          jsonPath: .status.mode
        - name: URL
          type: string
          jsonPath: .status.url
        - name: CLOUD-URL
          type: string
          jsonPath: .status.cloud-url
