# Crossplane providers the Mgmt Composition renders against: one GCP family
# per service the infra mgmt stack touches.
#
# The versions here are the ones the schema packages under packages/providers/
# were generated from (`just seed-mgmt-providers`) — keep them in step, or the
# rendered manifests can reference fields the installed provider does not have.
#
# Not here: a billing-account IAM kind (provider-gcp has none), so the
# billing.user / billing.costsManager grants of crossplane@ and
# crossplane-prod@ stay out of band.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-artifact
spec:
  package: ghcr.io/crossplane-contrib/provider-gcp-artifact:v2.6.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-binaryauthorization
spec:
