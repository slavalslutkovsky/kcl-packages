# Params for an aws client on Argo CD: an XChaosExperiment on both engines,
# an XDataLake (S3, Glue and IAM on aws), Gateway API routes and Tekton
# pipelines. Applications land in `argocd`, ordered by sync-wave.
#
#   kcl run packages/platform-addons -D params=packages/platform-addons/examples/params-argo.yaml
client: client-acme/acme
config:
  apiVersion: platform.shluviza.com/v1alpha1
  kind: ClientConfig
  cloud: aws
  delivery: argo
  platformSource:
    argo: {repoURL: https://github.com/shluviza/gitops.git, targetRevision: main}
  crossplane:
    vars:
      AWS_ACCOUNT_ID: "123456789012"
      XP_IRSA_ROLE_ARN: arn:aws:iam::123456789012:role/crossplane
  addons:
    litmus:
      remove: true
detected:
  - {group: gateway.networking.k8s.io, version: v1, versions: [v1], kind: HTTPRoute, count: 2, providers: [], sources: [client-acme/GitRepository/app]}
  - {group: platform.shluviza.com, version: v1alpha1, versions: [v1alpha1], kind: XChaosExperiment, count: 1, providers: [both], sources: [client-acme/GitRepository/app]}
  - {group: platform.shluviza.com, version: v1alpha1, versions: [v1alpha1], kind: XDataLake, count: 1, providers: [], sources: [client-acme/GitRepository/app]}
  - {group: tekton.dev, version: v1, versions: [v1], kind: Pipeline, count: 1, providers: [], sources: [client-acme/GitRepository/app]}
provided: []
previous: [litmus]
