# Backend app values (Helm-style) → app.Release. The `app` package's own main.k
# renders this directly — copy it to apps/<app>/k8s/values.yaml and run
#   kcl run /abs/path/to/packages/app -q | kubectl apply -f -
# No local main.k / kcl.mod needed. Validated against the typed app.Release schema
# on render: unknown/mistyped/missing fields are rejected, defaults are filled.
#
# A Release is a whole app in one file: a `workload:` (long-running) or `task:`
# (batch), plus optional `config:` (→ ConfigMap), `externalSecret:` and
# `catalog:` (the Backstage entities, rendered on their own — see the bottom).

workload:
  name: zerg-api
  namespace: zerg
  component: api-server
  image: yurikrupnik/zerg-api:latest
  port: 8080
  prometheus: true
  startupProbe:
    type: http
    path: /health
    port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 6
    timeoutSeconds: 3
  livenessProbe:
    type: http
    path: /health
    port: 8080
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  readinessProbe:
    type: http
    path: /ready
    port: 8080
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 512Mi
  envFrom:
    - kind: configMap
      name: zerg-shared-config
    - kind: configMap
      name: zerg-api-config       # the ConfigMap rendered from `config:` below
    - kind: secret
      name: zerg-shared-secrets
    - kind: secret
      name: zerg-api-secrets       # the Secret synced by `externalSecret:` below
  env:
    - name: REDIS_USERNAME
      secretName: redis-redis-account-default
      secretKey: username
    - name: REDIS_PASSWORD
      secretName: redis-redis-account-default
      secretKey: password
  hpa:
    minReplicas: 1
    maxReplicas: 10
    cpu: 70
    memory: 80

# → ConfigMap "zerg-api-config" (Release-only; a bare Workload can't express this).
config:
  PORT: "8080"
  TASKS_SERVICE_ADDR: "http://zerg-tasks.zerg.svc.cluster.local:50051"

# → ExternalSecret "zerg-api-secrets" from GCP Secret Manager (Release-only).
externalSecret:
  store: gcp-secret-manager
  items:
    - secretKey: JWT_SECRET
      key: app-secrets
      property: zerg-api.jwt_secret

# The Backstage entities for this release. NOT Kubernetes objects, so they are
# a separate render:
#   kcl run /abs/path/to/packages/app -D values=<this file> -D catalog=true -q
# Commit that output where Backstage reads it (a catalog-info.yaml registered as
# a Location). `spec.type` defaults to service, `spec.system` to the workload's
# `partOf`, and the Component is annotated `backstage.io/kubernetes-id: zerg-api`
# — the label every object above carries, so the portal's Kubernetes tab shows
# this release's Deployment, Service, HPA and chaos experiments.
catalog:
  owner: team-zerg                 # required: Backstage rejects an ownerless entity
  description: "Zerg's public HTTP API."
  tags: [rust, http]              # lowercase [a-z0-9+#-] only — checked at render
  techdocs: dir:.                 # → backstage.io/techdocs-ref
  source: url:https://github.com/yurikrupnik/zerg/tree/main/apps/api
  dependsOn:
    - resource:zerg-redis         # the Redis the env vars above point at
  links:
    - url: https://grafana.example.com/d/zerg-api
      title: Dashboard
      icon: dashboard
  apis:                            # one API entity each, auto-added to providesApis
    - name: zerg-api-openapi
      type: openapi
      definitionUrl: https://raw.githubusercontent.com/yurikrupnik/zerg/main/apps/api/openapi.yaml
