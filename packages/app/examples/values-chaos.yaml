# Chaos engineering values (Helm-style) → app.Release with Chaos Mesh and
# Litmus faults. Renders like values-backend.yaml
# (`kcl run /abs/path/to/packages/app -q`) plus, per `chaos:` entry, one Chaos
# Mesh experiment (default) or with `provider: litmus` a Litmus ChaosEngine +
# ChaosExperiment + runner ServiceAccount/RBAC in the `litmus` namespace (and
# a Role/RoleBinding in this one). Either way the target is this workload's
# own pods (app=<name> in `namespace`) — nothing else is ever selected. Needs
# the operator on the cluster: Chaos Mesh (devkit.toml installs it) or Litmus
# (the litmus-core chart in `litmus`).
#
# Chaos Mesh: without `schedule` an entry is a one-shot experiment: it starts
# as soon as it is applied and stops after `duration`. With `schedule` (cron)
# it becomes a Chaos Mesh Schedule that recurs. Litmus: a ChaosEngine runs
# once when created; there is no `schedule`. Delete the objects to stop either.
# Keep chaos in an overlay (values.staging.yaml) rather than the base if the
# same values also drive production.

workload:
  name: zerg-api
  namespace: zerg
  component: api-server
  image: yurikrupnik/zerg-api:latest
  port: 8080
  readinessProbe:
    type: http
    path: /ready
    port: 8080
  scaler:
    minReplicas: 2
    maxReplicas: 10
    cpu: 70
  chaos:
    # Kill one replica every ten minutes: exercises the autoscaler's floor and readiness gating.
    - name: kill-one
      type: pod-kill
      schedule: "*/10 * * * *"
    # 200ms ± 50ms on all outbound traffic of one pod for two minutes.
    - name: slow-net
      type: delay
      latency: 200ms
      jitter: 50ms
      duration: 2m
    # Drop a quarter of the packets on half of the pods.
    - name: lossy
      type: loss
      loss: "25"
      mode: fixed-percent
      value: "50"
    # Cut the database off (both directions) for the default 30s.
    - name: cut-db
      type: partition
      direction: both
      externalTargets: ["postgres-rw.dbs.svc"]
    # Two stress-ng workers at 80% of a core each, nightly at 03:00.
    - name: hot-cpu
      type: cpu
      workers: 2
      load: 80
      schedule: "0 3 * * *"
    # 256MB of pressure inside the container: does the limit hold?
    - name: memory-pressure
      type: memory
      size: 256MB
    # Responses of half of the pods delayed by 2s: do clients time out cleanly?
    # The port defaults to the workload's own (8080).
    - name: slow-responses
      type: http-delay
      httpTarget: Response
      latency: 2s
      mode: fixed-percent
      value: "50"
    # 100ms on half of the syscalls against the /tmp volume.
    - name: slow-disk
      type: io-latency
      volumePath: /tmp
      latency: 100ms
      percent: 50
    # The database name stops resolving (needs chaos-dns-server, which the chart deploys).
    - name: no-db-dns
      type: dns-error
      patterns: ["postgres-rw.dbs.svc*"]
    # The clock an hour behind: token expiry, cache TTLs, cron-in-process.
    - name: clock-skew
      type: time-skew
      timeOffset: "-1h"
    # The same faults through Litmus, for the comparison: one pod killed
    # (pod-delete), 200ms on all outbound traffic of half of the pods
    # (pod-network-latency), two cores of stress-ng for a minute (pod-cpu-hog).
    - name: litmus-kill
      provider: litmus
      type: pod-kill
    - name: litmus-slow-net
      provider: litmus
      type: delay
      latency: 200ms
      mode: fixed-percent
      value: "50"
      duration: 2m
    - name: litmus-hot-cpu
      provider: litmus
      type: cpu
      workers: 2
      duration: 1m

# The portal side of chaos. `-D catalog=true` renders a Component annotated
#   platform.example.org/chaos-faults: kill-one=pod-kill,slow-net=delay,...
# so Backstage can show what faults are aimed at this app without touching the
# cluster, and `backstage.io/kubernetes-id: zerg-api` — the label every object
# above carries, experiments included — so the component's Kubernetes tab lists
# the live PodChaos / NetworkChaos / Schedule objects next to the Deployment.
# See docs/backstage.md for the app-config that enables the custom resources.
catalog:
  owner: team-zerg
  description: "Zerg's public HTTP API — a chaos target."
  tags: [rust, http, chaos]
  links:
    - url: http://localhost:2333
      title: Chaos dashboard
      icon: dashboard
