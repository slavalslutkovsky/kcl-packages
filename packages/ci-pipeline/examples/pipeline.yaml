# A pipeline that uses every feature: mirrored base and tool images, the four scanner presets
# plus a custom one, and Trigger output. The scanners are listed to show them; one is enough.
# The trigger project and service account are example values.
name: web
repo:
  owner: shluviza
  name: example
triggers:
  push:
    branches: [main, 'release/**']
  pullRequest:
    branches: [main]
  paths: ['apps/web/**']
image:
  repository: me-west1-docker.pkg.dev/shl-artifacts/docker/web
  context: apps/web
  baseImages:
    BUILD_IMAGE: docker.io/library/node:22-bookworm-slim
    RUNTIME_IMAGE: gcr.io/distroless/nodejs22-debian12:nonroot
# Artifact Registry remote repositories (pull-through caches) in front of each upstream.
mirrors:
  docker.io: me-west1-docker.pkg.dev/shl-artifacts/docker-hub
  gcr.io: me-west1-docker.pkg.dev/shl-artifacts/gcr
scan:
  failOn: HIGH
  baseImages: report
  scanners:
    - use: ods
      env:
        ODS_LOCATION: europe
    - use: trivy
    - use: grype
    - use: snyk
    # Custom: secrets left in image layers, with Trivy's secret scanner.
    - name: secrets
      image: docker.io/aquasec/trivy:0.76.2
      input: archive
      report: trivy image --input "{archive}" --scanners secret --no-progress
      gate: trivy image --input "{archive}" --scanners secret --no-progress --exit-code 1
timeoutMinutes: 45
cloudBuild:
  machineType: E2_HIGHCPU_8
  trigger:
    project: shl-ci
    serviceAccount: cloud-build@shl-ci.iam.gserviceaccount.com
    namespace: ci
