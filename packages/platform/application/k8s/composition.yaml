apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: application
  # No `provider` label. The cloud.example.org Compositions carry one because
  # a claim picks between their backends; an Application has one
  # implementation — the routing flavour is a field (spec.route.type) inside
  # it, not a Composition to select — and the XRD names this Composition as
  # its defaultCompositionRef.
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: Application
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          # Pin a release with ?tag=<version> once published via `nx release`.
          source: oci://docker.io/yurikrupnik/application?tag=0.1.2
    - step: ready
      functionRef:
        name: function-auto-ready
