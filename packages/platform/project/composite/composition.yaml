apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: project
  # No `provider` label. The cloud.example.org Compositions carry one because
  # a claim picks between their backends; a Project has one implementation,
  # which picks a backend for each of its children from spec.cloud.provider.
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: Project
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          # Pin a release with ?tag=<version> once published via `nx release`.
          source: oci://docker.io/yurikrupnik/project?tag=0.1.1
    - step: ready
      functionRef:
        name: function-auto-ready
