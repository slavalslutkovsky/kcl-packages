# Crossplane Configuration package configuration-project-composite:
# this backend's Composition and exactly what it needs — the module's base
# package (XRD + Functions), the Providers it composes against and the
# configurations of any XR it composes. Installing it installs those and
# nothing else.
#
# `tools/configurations.sh sync` adds what kcl.mod implies (provider schema
# packages, other modules' xrd packages). What it cannot see is added here by
# hand: an operator installed through provider-helm by
# xrd/providerconfigs.yaml, an XR composed by kind, every dependency of a
# Composition rendered by a non-KCL function. `check` keeps both in step
# with kcl.mod and packages/providers/registry.yaml.
# Version: kcl.mod (nx release), the same one composition.yaml pins.
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: project-composite
spec:
  crossplane:
    version: ">=v2.2.0-0"
  dependsOn:
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-project
      version: '>=0.1.0'
    # Child XRs composed by kind (project.k `_kinds`); each picks its backend
    # at runtime, so the bases are the dependencies — install the backends
    # the projects use alongside.
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-postgres
      version: '>=0.1.0'
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-redis
      version: '>=0.1.0'
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-queue
      version: '>=0.1.0'
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-bucket
      version: '>=0.1.0'
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-registry
      version: '>=0.1.0'
    - apiVersion: pkg.crossplane.io/v1
      kind: Configuration
      package: docker.io/yurikrupnik/configuration-workload-identity
      version: '>=0.1.0'
