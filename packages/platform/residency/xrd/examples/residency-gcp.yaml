apiVersion: platform.example.org/v1alpha1
kind: Residency
metadata:
  namespace: default
  name: shl
spec:
  provider: gcp                    # the flag: catalog column + every child's compositionSelector
  locations:
    - name: il                     # -> me-west1 (Tel Aviv)
    - name: nl                     # -> europe-west4 (Eemshaven): the DR copy
  keys:
    - name: audit                  # org audit-log bucket CMEK: Israel only
      locations: [il]
    - name: app-data               # application CMEK in every location
    - name: signing                # release signing, Israel only
      locations: [il]
      purpose: sign-verify
      algorithm: ec-p256           # asymmetric: rotationDays is dropped by aws/gcp
  deletionPolicy: Orphan           # default: deleting the Residency never destroys keys
  tags:
    team: platform
