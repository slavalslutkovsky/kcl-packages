# Two tenants whose buckets are billed to their own AWS accounts.
#
#   kcl run packages/platform/tenant-account -D values=packages/platform/tenant-account/examples/values.yaml -q
#   kcl run packages/platform/tenant-account -D values=... -D output=client -D namespace=tenant-a -q
platform:
  # The IAM role the Crossplane AWS provider pods run as: the only principal
  # a client role trusts.
  roleArn: arn:aws:iam::111122223333:role/crossplane-provider-aws
  # How the provider gets that role (ProviderConfig spec.credentials, passed
  # through as-is): IRSA | PodIdentity | WebIdentity | Secret.
  credentials:
    source: IRSA
  # Default name of the role each client creates.
  roleName: platform-provisioner

accounts:
  # Buckets with spec.access: the client also lets the platform create
  # boundary-capped access roles named tenant-a-*.
  - namespace: tenant-a
    accountId: "444455556666"
    externalId: tenant-a-7f3c9e21   # sts:ExternalId; unique per client, generated by the platform
    accessRoles: true
  # Buckets only, a ProviderConfig named after the account's purpose.
  - namespace: tenant-b
    name: aws-prod
    accountId: "777788889999"
    externalId: tenant-b-0d84b6aa
