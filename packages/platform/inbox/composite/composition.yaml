apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: inbox
  # Deliberately no `provider` label. The cloud.example.org Compositions carry
  # one because a claim picks between their backends; this Composition is the
  # only implementation of Inbox and is backend-agnostic — it selects a backend
  # for each of its two children instead, from spec.provider.
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: Inbox
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          # Pin a release with ?tag=<version> once published via `nx release`.
          source: oci://docker.io/yurikrupnik/inbox?tag=0.1.2
    - step: ready
      functionRef:
        name: function-auto-ready
