    unused: [Backup, ClusterImageCatalog, Database, FailoverQuorum, ImageCatalog, Pooler,
             Publication, ScheduledBackup, Subscription]

  - name: knative
    source: knative/serving@knative-v1.23.0
    installedBy: not installed by this repo — the serverless/knative backend assumes Knative Serving is present
    schemas: packages/providers/knative/models
    groups: [serving.knative.dev]
    used:
      - kind: Service
        group: serving.knative.dev
        by: [cloud/serverless/knative]
    unused: [Configuration, Revision, Route, DomainMapping]

  - name: keda
    source: ghcr.io/kcl-lang/keda:0.1.3 (kcl-lang module; keda.sh/v1alpha1)
    installedBy: not installed by this repo — the app package's `scaler:` assumes KEDA is present
    schemas: kcl.mod dependency `keda` of packages/app
    groups: [keda.sh]
    used:
      - kind: ScaledObject
        group: keda.sh
        by: [app]
    unused: [ScaledJob, TriggerAuthentication, ClusterTriggerAuthentication]

  - name: external-secrets
    source: ghcr.io/kcl-lang/external-secrets:0.18.2 (kcl-lang module; external-secrets.io/v1)
    installedBy: devkit.toml deps.external-secrets (helm chart 2.9.0, external-secrets)
    schemas: kcl.mod dependency `external-secrets` of packages/app
    groups: [external-secrets.io, generators.external-secrets.io]
    used:
      - kind: ExternalSecret
        group: external-secrets.io
        by: [app]
    unused: [ClusterExternalSecret, ClusterPushSecret, ClusterSecretStore (referenced by name only —
             app.ExternalSecretSpec.store — never rendered), PushSecret, SecretStore, ACRAccessToken,
             ClusterGenerator, ECRAuthorizationToken, Fake, GCRAccessToken, GeneratorState,
             GithubAccessToken, Grafana, MFA, Password, QuayAccessToken, STSSessionToken, UUID,
             VaultDynamicSecret, Webhook]

  - name: cert-manager
    source: cert-manager/cert-manager@v1.21.1 (cert-manager.crds.yaml)
    installedBy: devkit.toml deps.cert-manager (helm chart 1.21.1, crds.enabled=true, cert-manager)
    schemas: none
    groups: [cert-manager.io, acme.cert-manager.io]
    used: []
    unused: [Certificate, CertificateRequest, ClusterIssuer, Issuer, Challenge, Order]

  - name: flagger
    source: fluxcd/flagger@v1.44.0 (artifacts/flagger/crd.yaml)
    installedBy: devkit.toml deps.flagger (helm chart 1.44.0, flagger)
    schemas: none
    groups: [flagger.app]
    notes: >-
      Installed for the replica-ownership contract only: the app package omits
      Deployment.spec.replicas under an autoscaler so Flagger and the HPA do
      not fight. No Canary is rendered.
    used: []
    unused: [Canary, MetricTemplate, AlertProvider]

  - name: kubeblocks
    source: apecloud/kubeblocks@v1.2.0-alpha.3 (kubeblocks_crds.yaml)
    installedBy: devkit.toml deps.kubeblocks-crds (wave 0) + deps.kubeblocks (helm chart 1.2.0-alpha.3, wave 1)
    schemas: none
    groups: [apps.kubeblocks.io, dataprotection.kubeblocks.io, experimental.kubeblocks.io,
             extensions.kubeblocks.io, operations.kubeblocks.io, parameters.kubeblocks.io,
             trace.kubeblocks.io, workloads.kubeblocks.io]
    used: []
    unused: [ClusterDefinition, Cluster, ComponentDefinition, Component, ComponentVersion,
             ConfigConstraint, Configuration, Rollout, ServiceDescriptor, ShardingDefinition,
             SidecarDefinition, ActionSet, BackupPolicy, BackupPolicyTemplate, BackupRepo, Backup,
             BackupSchedule, Restore, StorageProvider, NodeCountScaler, Addon, OpsDefinition,
             OpsRequest, ComponentParameter, ParamConfigRenderer, Parameter, ParametersDefinition,
             ParameterView, ReconciliationTrace, Instance, InstanceSet]

  - name: nats-jetstream
    source: tmp/nack-crds.yml
    installedBy: not installed — justfile seed-queue-providers fetches nack v0.24.0 CRDs into tmp/
    schemas: packages/providers/nats-jetstream/models
    groups: [jetstream.nats.io]
    notes: >-
      Schema package with no registry.yaml row (tools/providers.sh check reports
      it) and no consumer: the queue module composes SQS/Pub/Sub only.
    used: []
    unused: [Consumer (v1beta1), Stream (v1beta1), StreamTemplate, Account, Consumer (v1beta2),
             KeyValue, ObjectStore, Stream (v1beta2)]

