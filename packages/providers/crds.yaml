        group: apigatewayv2.aws.m.upbound.io
        by: [cloud/apigateway/aws]
    unused: [APIMapping, Authorizer, Deployment, DomainName, Integration, IntegrationResponse,
             Model, Route, RouteResponse, Stage, VPCLink]

  - name: aws-codebuild
