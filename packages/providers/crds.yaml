# crds.yaml — every CRD the operators and Crossplane providers this repo
# knows about, and whether anything here renders it.
#
# One row per operator or provider. `used` lists the kinds some renderer in
# this repo emits, with the packages (relative to packages/, or a repo path for
# hand-written YAML) that emit them; `unused` is every other kind the same
# source ships. "Unused" is not "unneeded": a provider installs all of its CRDs
# regardless, and an operator's internal kinds (Chaos Mesh Pod*Chaos, KubeBlocks
# *Definition, cert-manager Order/Challenge) are created by the operator itself.
#
# Fields
#   source       where the CRDs come from — image:tag, repo@ref, kcl-lang
#                module, or a helm chart
#   installedBy  what puts the CRDs on a cluster: a devkit.toml [[deps]] row,
#                a pkg.crossplane.io Provider in cloud/<module>/xrd/providers.yaml,
#                or "not installed"
#   schemas      the typed KCL package renderers import, if any
#   group(s)     the API group(s) the kinds live in
#   used         [{kind, group, by}] — `by` is the list of consumers
#   unused       kinds nothing here renders
#
# Derived from packages/providers/*/models (one file per CRD), the
# `import <pkg>.models.<version>.<file>` lines in packages/**/*.k, the
# apiVersion/kind pairs in packages/**/*.yaml and manifests/**, and the CRD
# lists of the pinned upstream releases for sources with no schema package.
# Refresh after `just seed`, a devkit.toml version bump, or a new Composition.
version: 1

# ── operators ─────────────────────────────────────────────────────────────────
# Controllers whose CRDs are composed directly (no Crossplane provider), plus
# Crossplane itself.
operators:
  - name: crossplane
    source: crossplane/crossplane@v2.3.4 (cluster/crds)
    installedBy: devkit.toml deps.crossplane (helm chart 2.3.4, crossplane-system)
    schemas: none — the Crossplane layer of every module is hand-written YAML
    groups: [apiextensions.crossplane.io, pkg.crossplane.io, ops.crossplane.io, protection.crossplane.io]
    used:
      - kind: CompositeResourceDefinition
        group: apiextensions.crossplane.io
        by: [cloud/<module>/xrd/xrd.yaml (16 modules), platform/appstack/xrd, platform/component/xrd]
      - kind: Composition
        group: apiextensions.crossplane.io
        by: [cloud/<module>/<backend>/composition.yaml (48), platform/appstack/stack, platform/component/flux]
      - kind: Function
        group: pkg.crossplane.io
        by: [cloud/apigateway/xrd, cloud/bucket/xrd, cloud/cluster/xrd, cloud/dns/xrd,
             cloud/email/xrd, cloud/iam/xrd, cloud/kms/xrd, cloud/name/xrd, cloud/network/xrd,
             cloud/postgres/xrd, cloud/queue/xrd, cloud/redis/xrd, cloud/registry/xrd,
             cloud/serverless/xrd, cloud/vm/xrd, cloud/workload-identity/xrd, manifests/crossplane,
             platform/appstack/xrd, platform/component/xrd]
      - kind: Provider
        group: pkg.crossplane.io
        by: [cloud/apigateway/xrd, cloud/bucket/xrd, cloud/cluster/xrd, cloud/dns/xrd,
             cloud/email/xrd, cloud/iam/xrd, cloud/kms/xrd, cloud/network/xrd, cloud/postgres/xrd,
             cloud/queue/xrd, cloud/redis/xrd, cloud/registry/xrd, cloud/serverless/xrd,
             cloud/vm/xrd, cloud/workload-identity/xrd]
      - kind: DeploymentRuntimeConfig
        group: pkg.crossplane.io
        by: [cloud/email/xrd, cloud/kms/xrd, cloud/postgres/xrd, cloud/queue/xrd, cloud/redis/xrd,
             cloud/registry/xrd, manifests/crossplane]
    unused: [CompositionRevision, EnvironmentConfig, ManagedResourceActivationPolicy,
             ManagedResourceDefinition, Usage (apiextensions), CronOperation, Operation, WatchOperation,
             Configuration, ConfigurationRevision, FunctionRevision, ImageConfig, Lock, ProviderRevision,
             ClusterUsage, Usage (protection)]

  - name: crossplane-provider-families
    source: crossplane-contrib/provider-upjet-{aws,gcp,azure}@v2.6.0 (package/crds, family CRDs)
    installedBy: pulled in as the provider-family-{aws,gcp,azure} dependency of every service provider above
    schemas: none — the service schema packages are generated with a --service filter that excludes the family
    groups: [aws.m.upbound.io, gcp.m.upbound.io, azure.m.upbound.io, aws.upbound.io, gcp.upbound.io, azure.upbound.io]
    used:
      - kind: ClusterProviderConfig
        group: "{aws,gcp,azure}.m.upbound.io"
        by: [every cloud Composition — composed MRs carry no providerConfigRef, so Crossplane resolves the
             ClusterProviderConfig named "default"; cloud/<module>/xrd/providerconfigs.yaml where present]
    unused: [ProviderConfig (namespaced), ProviderConfigUsage, ResourceGroup, ResourceProviderRegistration,
             Subscription (azure), and every cluster-scoped *.upbound.io v1 twin]

  - name: chaos-mesh
    source: chaos-mesh/chaos-mesh@v2.8.4
    installedBy: devkit.toml deps.chaos-mesh (helm chart 2.8.4, chaos-mesh) — or the same chart as a `manager` dependency
    schemas: packages/providers/chaos-mesh/models
    groups: [chaos-mesh.org]
    notes: >-
      The app package renders one experiment per Workload `chaos:` fault (or a
      Schedule around it); the manager package renders the same kinds with a
      free selector, plus Workflows for orchestrated runs. The Pod*Chaos kinds
      are the per-pod records Chaos Mesh derives from those; WorkflowNode is
      what a Workflow expands into; StatusCheck is the workflow engine's probe.
      The *Chaos kinds not listed under `used` are fault types neither package
      has a `type` for yet.
    used:
      - kind: NetworkChaos
        group: chaos-mesh.org
        by: [app, manager (through app.experiment)]
      - kind: PodChaos
        group: chaos-mesh.org
        by: [app, manager (through app.experiment)]
      - kind: Schedule
        group: chaos-mesh.org
        by: [app, manager (through app.experiment)]
      - kind: StressChaos
        group: chaos-mesh.org
        by: [app, manager (through app.experiment)]
      - kind: Workflow
        group: chaos-mesh.org
        by: [manager]
    unused: [AWSChaos, AzureChaos, BlockChaos, DNSChaos, GCPChaos, HTTPChaos, IOChaos, JVMChaos,
             KernelChaos, PhysicalMachine, PhysicalMachineChaos, PodHttpChaos, PodIOChaos,
             PodNetworkChaos, RemoteCluster, StatusCheck, TimeChaos, WorkflowNode]

  - name: litmus
    source: litmuschaos/chaos-operator@3.31.0 (deploy/crds)
    installedBy: not installed
    schemas: none
    groups: [litmuschaos.io]
    notes: >-
      The other chaos option, not taken: a Litmus experiment needs a
      ChaosExperiment installed from the hub per fault type plus a chaos
      ServiceAccount/Role per target namespace before a ChaosEngine can
      run, whereas a Chaos Mesh experiment is one self-contained CR. Listed
      so the choice is on record; nothing here renders these.
    used: []
    unused: [ChaosEngine, ChaosExperiment, ChaosResult]

  - name: flux-source
    source: fluxcd/source-controller@v1.9.2
    installedBy: devkit.toml deps.flux2 (helm chart 2.19.0 = Flux 2.9.1, flux-system)
    schemas: packages/providers/flux-source/models
    groups: [source.toolkit.fluxcd.io]
    used:
      - kind: GitRepository
        group: source.toolkit.fluxcd.io
        by: [platform/component/flux]
      - kind: HelmRepository
        group: source.toolkit.fluxcd.io
        by: [manager, platform/component/flux]
      - kind: OCIRepository
        group: source.toolkit.fluxcd.io
        by: [platform/component/flux]
    unused: [Bucket, ExternalArtifact, HelmChart]

  - name: flux-kustomize
    source: fluxcd/kustomize-controller@v1.9.2
    installedBy: devkit.toml deps.flux2 (helm chart 2.19.0 = Flux 2.9.1, flux-system)
    schemas: packages/providers/flux-kustomize/models
    groups: [kustomize.toolkit.fluxcd.io]
    used:
      - kind: Kustomization
        group: kustomize.toolkit.fluxcd.io
        by: [platform/component/flux]
    unused: []

  - name: flux-helm
    source: fluxcd/helm-controller@v1.6.2
    installedBy: devkit.toml deps.flux2 (helm chart 2.19.0 = Flux 2.9.1, flux-system)
    schemas: packages/providers/flux-helm/models
    groups: [helm.toolkit.fluxcd.io]
    used:
      - kind: HelmRelease
        group: helm.toolkit.fluxcd.io
        by: [manager, platform/component/flux]
    unused: []

  - name: cnpg
    source: cloudnative-pg/cloudnative-pg@v1.27.1
    installedBy: provider-helm Release in cloud/postgres/xrd/providerconfigs.yaml (cloudnative-pg chart)
    schemas: packages/providers/cnpg/models
    groups: [postgresql.cnpg.io]
    used:
      - kind: Cluster
        group: postgresql.cnpg.io
