# devkit configuration — see `devkit config` for the effective merged values.
#
# This repo needs devkit for two things:
#
#   1. the throwaway Kind cluster the Crossplane end-to-end tests run against
#      (`just e2e`, `just e2e-kclx`), and
#   2. everything that has to exist on that cluster — charts, composition
#      functions, XRDs, providers, Compositions and the example composites —
#      declared once, in dependency order, as `[[deps]]` rows below.
#
#      `devkit cluster deps` therefore installs the whole platform *and* the
#      resources under test. What it cannot do is build: the Rust function
#      image, its xpkg, and the KCL packages the Compositions pull are produced
#      by `just kclx-install` / `just e2e-publish` before deps run. See
#      docs/devkit.md.
#
# The app/overlay/database sections devkit offers for app monorepos are left at
# their defaults.

[namespaces]
dbs = "dbs"
monitoring = "monitoring"
external_secrets = "external-secrets"


[cluster]
name = "kcl-e2e"    # dedicated name: `just e2e-down` must never touch another cluster
workers = 3                  # worker node count
db_workers = 1              # tainted db-dedicated workers
ingress = true        # binds host ports 80/443 on the control plane
#kcl_package = "oci://docker.io/yurikrupnik/cluster"
#kcl_tag = "0.0.6"

[cluster.kcl_args]      # MUST sit directly after [cluster]'s scalar keys
oidc_bucket = "my-oidc-bucket"
oidc_id = "arus-dev"

[secrets]
config = ".vals.yaml"       # vals config file
output = ".env"


[flux]
# owner = "my-org"          # GitHub user/org; leave unset to derive from `gh api user`
repository = "gitops-v1"
branch = "main"
path = "clusters/mgmt"
personal = true

# Cluster dependencies, installed by `devkit cluster deps` (justfile `e2e-up`)
# once the cluster is up. Helm rows: name, repo, chart (default: name),
# version, namespace (default: "default"), timeout (default: "10m"), values
# (a values file path or list of paths — helm -f — resolved against this
# file's directory). Manifest rows: name + manifest (URL or repo-relative
# path, kubectl apply). Deps in the same wave (default 0) install in
# parallel; waves run in ascending order for CRD/controller ordering.
[[deps]]
name = "n8n"                 # the chart is `n8n`; `n8s` does not exist in this repo
repo = "https://community-charts.github.io/helm-charts"
version = "1.24.33"
namespace = "n8n"

# community-charts publishes no `web` chart (helm search repo returns nothing),
# so this row failed every run and aborted the wave — and with it every later
# wave, including the Crossplane stack. Restore it with a chart that exists.
#[[deps]]
#name = "web"
#repo = "https://community-charts.github.io/helm-charts"
#version = "1.24.33"
#namespace = "web"

[[deps]]
name =  "openbao"
repo = "https://openbao.github.io/openbao-helm"
version = "0.29.3"
namespace = "openbao"
# The agent injector's own controller writes `caBundle` into its
# MutatingWebhookConfiguration under the field manager `vault-k8s`, so the
# second `devkit cluster deps` (helm upgrade, server-side apply) hard-fails on
# a field-ownership conflict and takes every later wave down with it. Nothing
# here uses sidecar injection.
set = ["injector.enabled=false"]

[[deps]]
name = "crossplane"
repo = "https://charts.crossplane.io/stable"
version = "2.3.4"
namespace = "crossplane-system"

[[deps]]
name = "pgbouncer"
repo = "https://icoretech.github.io/helm"
version = "4.1.9"
namespace = "pgbouncer"
# The chart's userlist Secret template hard-errors without an admin password.
# Throwaway cluster, throwaway credential.
set = ["config.adminPassword=devkit"]

[[deps]]
name = "openebs"
repo = "https://openebs.github.io/openebs"
version = "4.6"
namespace = "openebs"
# Mayastor (replicated engine) needs hugepages + io-engine nodes — not
# available on kind/macOS; local PV engines are enough for e2e.
set = ["engines.replicated.mayastor.enabled=false"]
[[deps]]
name = "vcluster"
repo = "https://charts.loft.sh"
version = "0.37.0-rc.3"
namespace = "vcluster"

[[deps]]
name = "external-secrets"
repo = "https://charts.external-secrets.io"
version = "2.9.0"
namespace = "external-secrets"

# KubeBlocks >=1.0 requires its CRDs applied before the chart installs (the
# chart templates `lookup` them) — CRDs in wave 0, chart in wave 1.
[[deps]]
name = "kubeblocks-crds"
manifest = "https://github.com/apecloud/kubeblocks/releases/download/v1.2.0-alpha.3/kubeblocks_crds.yaml"

[[deps]]
name = "kubeblocks"
repo = "https://apecloud.github.io/helm-charts"
version = "1.2.0-alpha.3"
namespace = "kubeblocks"
wave = 1

#[[deps]]
#name = "ccowley"
#repo = "https://helm.cowley.tech"
#version = "0.0.2"
#namespace = "ccowley"
# cert-manager is not here: it is a `manager`-type dependency in
# packages/manager/examples/values.yaml, delivered by helm-controller. Listing
# it in both would give one release two owners (see docs/install-graph.md
# "Conflicts").

[[deps]]
name = "flagger"
repo = "https://flagger.app"
version = "1.44.0"
namespace = "flagger"

# Chaos Mesh — the operator behind the app package's `chaos:` faults
# (packages/app renders chaos-mesh.org PodChaos / NetworkChaos / StressChaos /
# Schedule). Chart 2.8.4 is Chaos Mesh v2.8.4, the ref the
# packages/providers/chaos-mesh schema package was generated from; keep them in
# step. Kind nodes run containerd, and chaos-daemon must talk to that socket
# to kill containers / shape their network. The dashboard is off: nothing here
# uses it and it is a pod.
[[deps]]
name = "chaos-mesh"
repo = "https://charts.chaos-mesh.org"
version = "2.8.4"
namespace = "chaos-mesh"
set = [
    "chaosDaemon.runtime=containerd",
    "chaosDaemon.socketPath=/run/containerd/containerd.sock",
    "dashboard.create=false",
]

# Flux itself — not a Crossplane provider. The `component` module composes
# source.toolkit.fluxcd.io / kustomize.toolkit.fluxcd.io / helm.toolkit.fluxcd.io
# objects directly, so these controllers and their CRDs must exist before its
# XRD (wave 2) is of any use. Chart 2.19.0 is Flux 2.9.1: source-controller
# v1.9.2, kustomize-controller v1.9.2, helm-controller v1.6.2 — the refs the
# packages/providers/flux-* schema packages were generated from. Keep them in
# step. The image automation, reflection and notification controllers are off:
# nothing here uses them and each one is a pod.
[[deps]]
name = "flux2"
repo = "https://fluxcd-community.github.io/helm-charts"
version = "2.19.0"
namespace = "flux-system"
set = [
    "imageAutomationController.create=false",
    "imageReflectionController.create=false",
    "notificationController.create=false",
]

# ─── Crossplane stack under test (waves 2-5) ──────────────────────────────────
#
# Wave 0 above brings up the crossplane chart itself (helm --wait), so from
# wave 2 on the pkg.crossplane.io and apiextensions.crossplane.io APIs exist.
# The order below is the dependency order Crossplane needs:
#
#   2. the composition functions the Compositions run, and the XRD that defines
#      the composite API,
#   3. the providers whose CRDs the composed managed resources are instances of,
#   4. the Compositions themselves (one per backend),
#   5. the example composites — the "run" part: applying these is what makes
#      Crossplane call our function and create managed resources.
#
# Prerequisites produced by `just kclx-install` (function image + xpkg in the
# local registry) and `just e2e-publish bucket` (the KCL packages the
# Compositions pull). Rows are `kubectl apply --server-side`, which does not
# wait: providers stay Unhealthy for a minute or two while their packages
# download, and the composites reconcile once the CRDs land. `devkit cluster
# deps` is idempotent — re-run it if wave 5 races the XRD's composite CRD.

[[deps]]
name = "crossplane-functions"
manifest = "manifests/crossplane/functions.yaml"
wave = 2

[[deps]]
name = "bucket-xrd"
manifest = "packages/cloud/bucket/xrd/xrd.yaml"
wave = 2

[[deps]]
name = "bucket-providers"
manifest = "packages/cloud/bucket/xrd/providers.yaml"
wave = 3

[[deps]]
name = "bucket-composition-aws"
manifest = "packages/cloud/bucket/aws/composition.yaml"
wave = 4

[[deps]]
name = "bucket-composition-azure"
manifest = "packages/cloud/bucket/azure/composition.yaml"
wave = 4

[[deps]]
name = "bucket-composition-gcp"
manifest = "packages/cloud/bucket/gcp/composition.yaml"
wave = 4

[[deps]]
name = "bucket-composition-rustfs"
manifest = "packages/cloud/bucket/rustfs/composition.yaml"
wave = 4

# Every example XR for the module (kubectl applies each file in the directory).
[[deps]]
name = "bucket-examples"
manifest = "packages/cloud/bucket/xrd/examples/"
wave = 5

# The `component` module: one namespaced XR per deployable component, composed
# into a Flux source + Kustomization/HelmRelease pair. providers.yaml here is
# not a Provider — it is the aggregated ClusterRole that lets Crossplane compose
# Flux kinds at all. The example XR pulls the artifact `just component-push`
# pushes to the local registry.
[[deps]]
name = "component-xrd"
manifest = "packages/platform/component/xrd/xrd.yaml"
wave = 2

[[deps]]
name = "component-providers"
manifest = "packages/platform/component/xrd/providers.yaml"
wave = 3

[[deps]]
name = "component-composition-flux"
manifest = "packages/platform/component/flux/composition.yaml"
wave = 4

[[deps]]
name = "component-examples"
manifest = "packages/platform/component/xrd/examples/"
wave = 5

# ─── Paid capabilities ────────────────────────────────────────────────────────
#
# `forge` (a Forgejo instance) and `repository` (objects inside one) are gated:
# their Compositions ask Crossplane to fetch the cluster-scoped Entitlement
# named after the XR's namespace, and fail the render with a named fatal result
# when it does not grant the feature. Three prerequisites, in this order:
#
#   wave 1  the Entitlement CRD, and the aggregated ClusterRole WITHOUT WHICH
#           Crossplane may not read it (a kubectl-installed CRD gets no grant
#           from the rbac-manager). Wave 1 because wave 0's crossplane chart
#           must already have registered the aggregation.
#   wave 2  the records themselves — inputs to composition, not composites.
#   waves 2-5  the usual XRD / providers / Composition / examples ladder.
#
# The examples live in namespace `tenant-a`, which the tenant-a record grants;
# `tenant-free` is the negative case, and applying a Forge there is expected to
# fail rather than provision.
[[deps]]
name = "entitlement-crd"
manifest = "packages/platform/entitlement/crd.yaml"
wave = 1

[[deps]]
name = "entitlement-rbac"
manifest = "packages/platform/entitlement/rbac.yaml"
wave = 1

[[deps]]
name = "entitlement-records"
manifest = "packages/platform/entitlement/examples/"
wave = 2

[[deps]]
name = "forge-xrd"
manifest = "packages/cloud/forge/xrd/xrd.yaml"
wave = 2

[[deps]]
name = "forge-providers"
manifest = "packages/cloud/forge/xrd/providers.yaml"
wave = 3

[[deps]]
name = "forge-providerconfigs"
manifest = "packages/cloud/forge/xrd/providerconfigs.yaml"
wave = 4

[[deps]]
name = "forge-composition-forgejo"
manifest = "packages/cloud/forge/forgejo/composition.yaml"
wave = 4

[[deps]]
name = "forge-examples"
manifest = "packages/cloud/forge/xrd/examples/"
wave = 5

[[deps]]
name = "repository-xrd"
manifest = "packages/cloud/repository/xrd/xrd.yaml"
wave = 2

[[deps]]
name = "repository-providers"
manifest = "packages/cloud/repository/xrd/providers.yaml"
wave = 3

[[deps]]
name = "repository-composition-forgejo"
manifest = "packages/cloud/repository/forgejo/composition.yaml"
wave = 4

# Last of all: a Repository needs the forge it writes into to be up, and the
# forge is itself a wave-5 XR. `devkit cluster deps` is idempotent — the second
# run is what usually makes this one succeed.
[[deps]]
name = "repository-examples"
manifest = "packages/cloud/repository/xrd/examples/"
wave = 5

[tilt]
enabled = true

# Endpoints printed after `devkit up`.
[[endpoints]]
label = "Tilt UI"
url = "http://localhost:10350"
