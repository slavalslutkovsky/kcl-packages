name: Release

# Automatically versions and publishes KCL packages on every push to main.
#
# Versioning is driven by `nx affected`, diffed against the latest release tag:
# any releasable package whose code (or transitive dependency) changed since
# that tag gets a patch bump. Commit messages are not parsed - any message
# works. A push with no affected releasable projects is a clean no-op, and
# manually re-running the workflow with no source changes does nothing.
#
# For each released package, nx will:
#   1. bump the version in its kcl.mod and update its CHANGELOG.md
#   2. commit "chore(release): <pkg>@<version>" and tag "<pkg>@<version>"
#   3. publish it to oci://docker.io/<DOCKERHUB_USERNAME>/<pkg>:<version>
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   - DOCKERHUB_USERNAME : your Docker Hub account (also the OCI namespace)
#   - DOCKERHUB_TOKEN    : a Docker Hub access token with Read/Write scope

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the version commit + tags back to the repo

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Each package publishes to oci://docker.io/<namespace>/<pkg>.
      # On Docker Hub the namespace is your username; change this if you
      # publish under a different Docker Hub organization.
      KCL_REGISTRY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the last release tag

      - name: Set affected base to latest release tag
        # We diff against the most recent "{project}@{version}" tag rather than
        # the last successful workflow run. nx-set-shas would use the SHA the
        # previous run was *triggered on*, which sits before the release commit
        # the workflow itself pushed — so every subsequent run would see that
        # release commit in the diff and re-bump every project. Basing off the
        # latest release tag (which points at the release commit) excludes it
        # from the diff, making re-runs with no source changes a clean no-op.
        run: |
          LATEST=$(git tag -l '*@*' --sort=-creatordate | head -n 1)
          if [ -n "$LATEST" ]; then
            echo "Base: $LATEST"
            echo "NX_BASE=$LATEST" >> "$GITHUB_ENV"
          else
            ROOT=$(git rev-list --max-parents=0 HEAD | head -n 1)
            echo "No release tags yet, basing off root commit: $ROOT"
            echo "NX_BASE=$ROOT" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install KCL CLI
        run: curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `kcl registry login` cannot be used: it validates the credentials, then
      # fails to persist them. kpm builds its store over its OWN config file
      # (kpm pkg/client/login.go:22) which declares no credsStore, so oras falls
      # back to a FileStore with puts disabled -> "putting plaintext credentials
      # is disabled". `docker login` does not help either: it stores Docker Hub
      # under "https://index.docker.io/v1/", while `kcl mod push` looks up the
      # raw "docker.io" and oras normalises the stored key to "index.docker.io",
      # so the lookup misses. Writing kpm's own config with a literal "docker.io"
      # key is what the read path (pkg/downloader/credential.go) actually finds.
      - name: Configure kpm credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # kpm resolves its credential file to $KCL_PKG_PATH/.kpm/config/config.json,
          # falling back to the XDG data home when KCL_PKG_PATH is unset.
          cred_dir="${KCL_PKG_PATH:-${XDG_DATA_HOME:-$HOME/.local/share}/kcl/modules}/.kpm/config"
          mkdir -p "$cred_dir"
          auth=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
          printf '{"auths":{"docker.io":{"auth":"%s"}}}' "$auth" > "$cred_dir/config.json"
          chmod 600 "$cred_dir/config.json"
          jq empty "$cred_dir/config.json" && echo "wrote $cred_dir/config.json"

      - name: Determine affected releasable projects
        id: affected
        # Intersect `nx affected` with the projects nx.json marks releasable
        # ("tag:lang:kcl" minus "tag:area:providers") so internal tools and
        # provider/schema projects never end up in the release set.
        run: |
          AFFECTED=$(pnpm exec nx show projects \
            --affected \
            --projects="tag:lang:kcl" \
            --exclude="tag:area:providers" \
            --json | jq -r 'join(",")')

          if [ -z "$AFFECTED" ]; then
            echo "No affected releasable projects."
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Affected: $AFFECTED"
          echo "projects=$AFFECTED" >> "$GITHUB_OUTPUT"

      - name: Version, changelog and tag (patch bump)
        if: steps.affected.outputs.projects != ''
        id: version
        # Force a patch bump for each affected releasable project. We skip
        # publishing here so the publish step only runs against projects whose
        # tag actually moved (otherwise `kcl mod push` re-pushes existing
        # versions and fails).
        run: |
          BEFORE=$(git rev-parse HEAD)
          FIRST_RELEASE=""
          if ! git tag | grep -q .; then
            echo "No release tags found - performing first release."
            FIRST_RELEASE="--first-release"
          fi

          pnpm exec nx release \
            --projects="${{ steps.affected.outputs.projects }}" \
            --specifier=patch \
            --skip-publish \
            $FIRST_RELEASE

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Nothing was versioned."
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tags follow the "{projectName}@{version}" pattern, so strip the
          # trailing "@<version>" to recover the bumped project names.
          BUMPED=$(git tag --points-at HEAD | sed 's/@[^@]*$//' | sort -u | paste -sd, -)
          echo "Bumped: $BUMPED"
          echo "projects=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Publish bumped packages to OCI
        if: steps.version.outputs.projects != ''
        run: pnpm exec nx release publish --projects="${{ steps.version.outputs.projects }}" --yes

      - name: Push version commits and tags
        if: steps.version.outputs.projects != ''
        run: git push --follow-tags origin HEAD:main
