apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: residencies.platform.example.org
  title: Residency (platform.example.org/v1alpha1)
  description: "Where an organization is allowed to keep data, and the encryption keys that live there. A Residency lists LOGICAL locations (il, de, nl, gb, us-va — jurisdictions, not cloud regions), resolves each to the concrete region of the chosen backend from a built-in catalog, and composes one EncryptionKey per (location, key) pair in that region. A workload that must stay in Israel asks for the `il` key; which cloud region that is on AWS, GCP, Azure or OCI is this resource's business, not the workload's. Like Inbox this XR composes CHILD COMPOSITE RESOURCES (cloud.example.org EncryptionKey) rather than managed resources, typed against the kms-xrd schemas, so it knows nothing about KeyRings, Key Vaults or transit mounts; the kms capability keeps owning that mapping. Each child is named <residency>-<location>-<key>. A key is created only in the region of its location — never replicated elsewhere — because CMEK requires the key in the same location as the data it protects, and a copy of an Israeli key in the EU would be an Israeli secret outside Israel. The catalog maps a location to a region in the SAME COUNTRY on every backend or not at all: nl has no AWS region, so an nl location on aws is a render error until you set its `region` explicitly (and thereby choose a different jurisdiction on purpose). openbao has no regions: its keys live in the cluster's OpenBao, and residency is where that cluster runs."
