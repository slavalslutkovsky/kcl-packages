apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: apigateways.cloud.example.org
  title: ApiGateway (cloud.example.org/v1alpha1)
  description: "Portable managed API gateway: one HTTPS endpoint that proxies every request to an existing HTTP(S) backend. Every field below is a COMMON parameter mapped onto each backend's native resources (AWS API Gateway v2 HTTP API via quick create, Azure API Management Consumption service + catch-all API, GCP Apigee environment + environment group + TargetServer). Fields a backend cannot express are documented as ignored rather than silently dropped; a request a backend cannot fulfil at all (cors on gcp) is rejected by its Composition rather than left quietly unmet. The gcp backend is the one incomplete endpoint: provider-gcp-apigee ships no APIProxy resource, so the proxy bundle binding a path to the composed TargetServer must be deployed out of band — status.environment and status.targetServer name what it has to target. GCP API Gateway is not an alternative: it is google-beta-only and absent from upjet-gcp."
  tags:
    - apigateway
    - aws
    - azure
    - crossplane
    - gcp
    - xrd
  annotations:
    backstage.io/source-location: url:https://github.com/slavalslutkovsky/kcl-packages/tree/main/packages/cloud/apigateway/xrd/
    github.com/project-slug: slavalslutkovsky/kcl-packages
