metadata:
  name: organizations.cloud.example.org
  title: Organization (cloud.example.org/v1alpha1)
  description: "The resource hierarchy of one cloud organization, declared in a single XR: the folder tree, the accounts inside it, the organization policies that constrain them, the org-level audit configuration, and the IAM grants at the top of the tree. Every field below is a COMMON parameter mapped onto each backend's native objects: gcp Folder, Project (+ ProjectService per enabled API), orgpolicy Policy, OrganizationIAMAuditConfig, Organization/FolderIAMMember aws OrganizationalUnit, Account, Organizations Policy (service control policy) + PolicyAttachment azure ManagementGroup, ManagementGroupPolicyAssignment, RoleAssignment scoped to the management group The three clouds agree on the tree and disagree on everything hanging off it, so a field a backend cannot honour FAILS the render with a message naming the alternative — it is never silently dropped. Read each field's description for the backends that refuse it. This is the \"run once, own forever\" XR — everything below is org-wide and singular, so ONE Organization XR should exist per cloud organization. Two XRs naming the same orgId with different folder or policy sets fight over the same external objects. Deliberately NOT here: * service accounts and their grants — that is Identity (cloud.example.org/v1alpha1), one XR per workload identity; * per-account networks, clusters, databases — the capability XRs own those, and they take an account/project id as input; * billing accounts, creation of the organization itself and domain verification — none of the three clouds exposes them as an API a controller may create; they are bought, then referenced."
