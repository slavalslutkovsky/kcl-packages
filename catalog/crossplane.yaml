apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: workloadidentities.cloud.example.org
  title: WorkloadIdentity (cloud.example.org/v1alpha1)
  description: "Keyless identity for a workload running in a Kubernetes cluster: a Kubernetes ServiceAccount is bound to a cloud identity, so pods using that KSA get cloud credentials from the cluster's token issuer instead of a mounted secret. GCP: Service Account + roles/iam.workloadIdentityUser member serviceAccount:<pool>[ns/ksa] (GKE Workload Identity). AWS: IAM Role whose trust policy allows sts:AssumeRoleWithWebIdentity for system:serviceaccount:ns:ksa from the cluster's OIDC provider (IRSA). Azure: User Assigned Identity + FederatedIdentityCredential for system:serviceaccount:ns:ksa (Workload Identity). Fields a backend cannot honour make the render FAIL with a clear message rather than silently binding a different principal or granting different access than was asked for."
  tags:
    - aws
