  description: "Hub-and-spoke connectivity for networks that already exist: one managed transit fabric plus one attachment per spoke network. Every field below is a COMMON parameter mapped onto each cloud's native hub: aws Transit Gateway + one TransitGatewayVpcAttachment per spoke VPC (+ Transit Gateway route tables, their associations and propagations, and an optional route toward the gateway in each spoke's own route tables) gcp Network Connectivity Center Hub + one VPC Spoke per spoke network (presetTopology MESH or STAR) azure Virtual WAN + Virtual Hub + one VirtualHubConnection per spoke VNet (+ a custom hub route table when the spokes must not see each other) This XR does NOT create the spoke networks. It attaches them: spokes[].network names a network that already exists — the one a `Network` XR (cloud.example.org/v1alpha1) reports as status.id / status.selfLink. Keeping the two apart is what lets a spoke be detached without touching the network, and a hub be deleted without deleting anything that carries workloads. Fields a backend cannot express are documented as ignored rather than silently dropped."
