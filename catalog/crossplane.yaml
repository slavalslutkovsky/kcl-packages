apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: applications.platform.example.org
  title: Application (platform.example.org/v1alpha1)
  description: "One long-running HTTP application in this namespace: the workload, the config and secret material it reads, and the north-south route that puts it on a hostname. This XR is a WRAPPER, not a second implementation. The Deployment, Service, ConfigMap, KEDA ScaledObject and ExternalSecret are rendered by the `app` package (packages/app) — the same library `kcl run packages/app -D values=…` and `just component-push` use — so an Application and a values.yaml produce the same objects from the same code. What this XRD adds on top is (1) a namespaced, RBAC-able API instead of a file, (2) the wiring the values file leaves to the author: `config` is mounted as envFrom, `secrets` produces an ExternalSecret that is also mounted as envFrom, and (3) the route, which the app package does not model at all. Deliberately NOT exposed, because Crossplane continuously re-applies desired state and these do not survive that: `app`'s batch archetype (Job/CronJob — spec.template is immutable and a completed Job would be recreated forever), its one-shot Chaos Mesh faults, and its Backstage `catalog:` block (catalog entities are not Kubernetes objects; keep rendering those with `just catalog`)."
  tags:
    - application
    - crossplane
    - xrd
  annotations:
    backstage.io/source-location: url:https://github.com/slavalslutkovsky/kcl-packages/tree/main/packages/platform/application/xrd/
    github.com/project-slug: slavalslutkovsky/kcl-packages
    jira/project-key: PLAT
