apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: workflows.cloud.example.org
  title: Workflow (cloud.example.org/v1alpha1)
  description: "Portable managed workflow orchestration: a serverless state machine that sequences calls to other services, retries failed steps and survives for as long as an execution runs. Every field below is a COMMON parameter mapped onto each backend's native resources (GCP Workflows Workflow, AWS Step Functions StateMachine [+ execution Role], Azure Logic Apps AppWorkflow + one AppTriggerCustom / AppActionCustom per definition entry). Fields a backend cannot express are documented as ignored rather than silently dropped. The workflow SOURCE is not portable and is not translated: each cloud has its own workflow language, so `definition` is written in the language of the backend the XR selects."
