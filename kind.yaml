# kind.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./psa
        containerPath: /etc/kubernetes/psa
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            admission-control-config-file: /etc/kubernetes/psa/config.yaml
            audit-policy-file: /etc/kubernetes/psa/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit.log
            audit-log-maxage: "1"
          extraVolumes:
          - name: psa
            hostPath: /etc/kubernetes/psa
            mountPath: /etc/kubernetes/psa
            readOnly: true
            pathType: Directory
          - name: audit-log
            hostPath: /var/log/kubernetes
            mountPath: /var/log/kubernetes
            readOnly: false
            pathType: DirectoryOrCreate
  - role: worker