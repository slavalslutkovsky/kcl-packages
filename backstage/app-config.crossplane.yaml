# Backstage app-config fragment for the Crossplane estate in this repo.
#
# There is no Backstage app here — `packages/manager/examples/values.yaml` installs the
# stock `backstage` 2.10.1 chart, so this file is a drop-in for an EXISTING app: pass it as
# an extra `--config` (`backstage-backend --config app-config.yaml --config app-config.crossplane.yaml`)
# or paste the blocks into that app's own config. Backstage deep-merges configs per key but
# *replaces* arrays, so if your app already declares `catalog.locations`,
# `proxy.endpoints` or `kubernetes.customResources`, merge the lists by hand instead of
# stacking two files.
#
# Every block below names the plugin package that reads it. Secrets are env refs only.

catalog:
  # Read by the core catalog backend (`@backstage/plugin-catalog-backend`). Entities are
  # files in git, not cluster objects: render -> commit -> Backstage polls the Location.
  # `catalog/crossplane.yaml` is generated by `just crossplane-catalog` (tools/catalog);
  # the other two come from `just catalog` / `just manager-catalog` (docs/backstage.md).
  locations:
    - type: url
      target: https://github.com/slavalslutkovsky/kcl-packages/blob/main/catalog/crossplane.yaml
    - type: url
      target: https://github.com/slavalslutkovsky/kcl-packages/blob/main/catalog/zerg-api.yaml
    - type: url
      target: https://github.com/slavalslutkovsky/kcl-packages/blob/main/catalog/platform.yaml

  # Also the catalog backend. A Location may only emit kinds listed here, and the default
  # rules do not include `Resource`, so without this the example-XR entities are dropped
  # with a "not allowed" error rather than ignored. These five are exactly what the
  # emitter writes: Domain (crossplane-platform), System (one per capability module),
  # API (one per XRD), Component (Compositions + provider schema libraries),
  # Resource (one per example XR).
  rules:
    - allow: [Domain, System, API, Component, Resource]

# Read by `@backstage/integration` and through it by every GitHub-backed plugin:
# `@backstage-community/plugin-github-issues` and
# `@roadiehq/backstage-plugin-github-pull-requests` resolve the host from an entity's
# `backstage.io/source-location` / `github.com/project-slug` and then use these credentials.
# The catalog backend needs it too, to read the raw `blob/main` Locations above from a
# private repo.
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# Read by the proxy backend (`@backstage/plugin-proxy-backend`) on behalf of
# `@roadiehq/backstage-plugin-jira`, which is browser-side and cannot hold a credential.
#
# GitHub Issues is the authoritative ticket source for this repo — the issues live next to
# the code the emitter scans, and the same issues are what the MCP server serves to agents.
# Jira is the secondary card: it is here because delivery is tracked in Jira, and the
# `jira/project-key` annotation the emitter writes is what binds an entity to that board.
proxy:
  endpoints:
    '/jira/api':
      target: ${JIRA_BASE_URL}
      headers:
        # Jira Cloud: `Basic base64(<email>:<api-token>)`, supplied whole in JIRA_TOKEN.
        Authorization: Basic ${JIRA_TOKEN}
        Accept: application/json
        Content-Type: application/json
        # Opts out of Jira's XSRF check for cookie-less API calls.
        X-Atlassian-Token: no-check
        # Jira rejects requests carrying a browser origin; any whitespace-free UA works.
        User-Agent: backstage-crossplane-portal

# Read by `@roadiehq/backstage-plugin-jira` 2.14.0. Its config schema (`config.d.ts`) has
# exactly four keys — proxyPath, product, apiVersion, confluenceActivityFilter. There is no
# `jira.token` (the credential is the proxy header above) and no `jira.defaultFilter`: the
# card's scope comes from the per-entity `jira/project-key`, `jira/component` and
# `jira/label` annotations, and any JQL filter is a prop on the card in EntityPage.tsx.
jira:
  proxyPath: /jira/api
  product: cloud
  apiVersion: latest

# Read by `@backstage/plugin-kubernetes` + `-backend`. This is the only place live state
# enters the portal: nothing ingests cluster objects into the catalog. An entity's
# Kubernetes tab lists these kinds where they carry its `backstage.io/kubernetes-id`.
kubernetes:
  serviceLocatorMethod: {type: multiTenant}
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: platform-manager
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
  customResources:
    # Every XR plural this repo defines, from `spec.group` + `spec.names.plural` +
    # `spec.versions[].name` of the 25 `packages/*/*/xrd/xrd.yaml` files. Claims are not
    # listed: no XRD here declares `claimNames`, so the XR is the only served kind.
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: apigateways}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: backupplans}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: buckets}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: kubernetesclusters}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: dnszones}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: emaildomains}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: forges}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: networkhubs}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: identities}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: encryptionkeys}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: landingpages}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: names}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: networks}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: organizations}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: postgresinstances}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: queues}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: redisinstances}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: registries}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: repositories}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: serverlessapps}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: virtualmachines}
    - {group: cloud.example.org, apiVersion: v1alpha1, plural: workloadidentities}
    - {group: platform.example.org, apiVersion: v1alpha1, plural: applications}
    - {group: platform.example.org, apiVersion: v1alpha1, plural: appstacks}
    - {group: platform.example.org, apiVersion: v1alpha1, plural: components}
    - {group: platform.example.org, apiVersion: v1alpha1, plural: inboxes}
    # The workload kinds `packages/app` and `packages/manager` render — unchanged from
    # docs/backstage.md § Chaos in the portal, kept here so one fragment covers both.
    - {group: chaos-mesh.org, apiVersion: v1alpha1, plural: podchaos}
    - {group: chaos-mesh.org, apiVersion: v1alpha1, plural: networkchaos}
    - {group: chaos-mesh.org, apiVersion: v1alpha1, plural: stresschaos}
    - {group: chaos-mesh.org, apiVersion: v1alpha1, plural: schedules}
    - {group: chaos-mesh.org, apiVersion: v1alpha1, plural: workflows}
    - {group: keda.sh, apiVersion: v1alpha1, plural: scaledobjects}

# Read by `@roadiehq/rag-ai-backend` and its embeddings module. The key is `ai`, not
# `ragAi` — that is what the plugin's config schema declares. `supportedSources: [catalog]`
# makes the Backstage catalog the only embeddings source, which is the point here: the
# corpus is the generated Crossplane entities (XRD schemas, Composition relations, usage
# counts, findings), so "which module renders a GCP bucket" is answerable from the portal.
#
# Model choice is deliberately env-driven and keyless in git. OpenAI-compatible endpoints
# work via `openAiBaseUrl` (Ollama, vLLM, a gateway), so a self-hosted model needs no code
# change. Vectors need Postgres with the `vector` and `uuid-ossp` extensions
# (`@roadiehq/rag-ai-storage-pgvector`) — the same Postgres the chart already requires, or
# a `PostgresInstance` XR from `packages/cloud/postgres`.
ai:
  supportedSources: ['catalog']
  prompts:
    prefix: >-
      You answer questions about a Crossplane platform defined in KCL. Entities are
      generated from the repo: an API is an XRD, a Component is a Composition package or a
      provider schema library, a Resource is an example XR. Cite the entity name and its
      platform.example.org annotations. Use the following documents to answer.
    suffix: "Begin! \n Question: \n"
  storage:
    pgvector:
      chunksize: 500
  embeddings:
    chunkSize: 1000
    chunkOverlap: 200
    concurrencyLimit: 10
    openai:
      # Defaults to process.env.OPENAI_API_KEY when omitted; named here so a missing
      # credential fails at startup instead of at the first question.
      openAiApiKey: ${OPENAI_API_KEY}
      openAiBaseUrl: ${OPENAI_BASE_URL}
      modelName: ${OPENAI_EMBEDDINGS_MODEL}
