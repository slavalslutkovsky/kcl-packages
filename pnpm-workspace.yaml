packages:
  - 'packages/*'
  - 'tools/*'

# pnpm 11 asks for an explicit decision per package that ships install scripts.
# protobufjs generates its CLI shims; puppeteer downloads the Chromium the bench
# report verifier drives (tools/bench/src/verify.ts).
allowBuilds:
  '@swc/core': true
  nx: true
  protobufjs: true
  puppeteer: true

# Legacy (pnpm 10) form of the same allow-list; kept so older pnpm still builds.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - nx
  - protobufjs
  - puppeteer

# `trustPolicy: no-downgrade` flags releases published without provenance after
# earlier ones had it. These two are legitimate manual publishes (semver 6.3.1 is
# the ReDoS backport by the npm CLI team; undici-types 6.21.0 by its maintainer);
# lockfile integrity matches the registry. Pinned to exact versions only.
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
