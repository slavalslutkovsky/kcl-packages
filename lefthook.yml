# Generated by `butler repo init` (sha256 fe6aa9c46c50c8de) from its template and lefthook.local.yml (local wins). Edit lefthook.local.yml, not this file.
assert_lefthook_installed: true
pre-commit:
  parallel: false
  jobs:
  - name: biome
    glob: '*.{js,jsx,ts,tsx,json,jsonc,css}'
    group:
      piped: true
      jobs:
      - name: biome-fmt
        run: pnpm exec biome check --write --linter-enabled=false --no-errors-on-unmatched {staged_files}
        stage_fixed: true
      - name: biome-check
        run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    skip: true
  - name: ruff-format
    glob: '*.py'
    run: ruff format {staged_files}
    stage_fixed: true
  - name: kcl-fmt
    glob: '*.k'
    run: just fmt-files {staged_files}
    stage_fixed: true
    exclude:
    - packages/providers/**
  - name: kcl-lint
    glob: '*.k'
    exclude:
    - packages/providers/**
    run: just lint-files {staged_files}
  - name: yaml-syntax
    glob: '*.{yaml,yml}'
    run: just yaml-check {staged_files}
  - name: package-integrity
    glob: '*.{mod,yaml}'
    run: just mod-check
  - name: secrets
    run: just secrets-check {staged_files}
  - name: install-graph
    glob: '{devkit.toml,packages/manager/examples/values.yaml,tools/graph/**}'
    run: just graph-check
  - name: crossplane-catalog
    glob: '{packages/**/xrd.yaml,packages/**/composition.yaml,packages/**/kcl.mod,tools/catalog/**}'
    run: just crossplane-catalog-check
  - name: typecheck
    glob: tools/**/*.ts
    run: just typecheck
prepare-commit-msg:
  jobs:
  - name: authorship-stamp
    run: bun tools/authorship/stamp.ts "{1}" "{2}"
    skip: true
commit-msg:
  jobs:
  - name: conventional
    run: |
      subject=$(grep -vE '^(#|[[:space:]]*$)' "{1}" | head -n1)
      case "$subject" in "Merge "*|"Revert \""*|"fixup! "*|"squash! "*|"amend! "*) exit 0 ;; esac
      if ! printf '%s\n' "$subject" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?!?: .+"; then
        echo "Commit message must follow Conventional Commits format"
        echo "Example: feat(api): add user authentication"
        echo "Got: $subject"
        exit 1
      fi
    skip: true
  - name: authorship
    run: bun tools/authorship/check.ts commit-msg "{1}"
    skip: true
  - name: conventional-commit
    run: just commit-msg {1}
pre-push:
  parallel: false
  jobs:
  - name: biome-ci
    run: pnpm exec biome ci .
    skip: true
  - name: check
    run: just check
  - name: rust
    glob: rust/**
    run: just kclx-test
  - name: python
    glob: python/**
    run: just pkgreg-test
  - name: typecheck
    run: just typecheck
post-checkout:
  jobs:
  - name: deps-sync
    run: pnpm install --frozen-lockfile 2>/dev/null || true
    skip: true
post-merge:
  jobs:
  - name: deps-update
    run: pnpm install --frozen-lockfile 2>/dev/null || true
    skip: true
